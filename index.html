<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ff8a3d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<title>にほんご あそび（試作）</title>
<style>
  :root{--bg:#fff7e6;--ink:#3a2e22;--accent:#ff8a3d;--ok:#34b36b;--card:#ffffff;--soft:#ffe3bd}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Hiragino Maru Gothic ProN","Yu Gothic",system-ui,sans-serif}
  #app{max-width:900px;margin:0 auto;padding:16px;min-height:100%}
  header{display:flex;align-items:center;justify-content:space-between;gap:8px}
  h1{font-size:clamp(20px,4vw,30px);margin:0}
  .stars{font-size:22px;font-weight:700}
  .btn{border:0;border-radius:24px;padding:14px 22px;font-size:20px;font-weight:700;background:var(--accent);color:#fff;cursor:pointer;box-shadow:0 4px 0 #c96a25}
  .btn:active{transform:translateY(3px);box-shadow:0 1px 0 #c96a25}
  body.teen{--bg:#eef3fb;--soft:#cfdcf0;--accent:#3b82c4} .teen .btn{box-shadow:0 4px 0 #285f93} .teen .btn.ghost{box-shadow:0 3px 0 #b9c8e0}
  .btn.ghost{background:#fff;color:var(--ink);box-shadow:0 3px 0 #e0cfae}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-top:20px}
  .scene{background:var(--card);border-radius:28px;padding:24px;text-align:center;font-size:24px;font-weight:700;cursor:pointer;box-shadow:0 5px 0 var(--soft)}
  .scene .big{font-size:64px;display:block;margin-bottom:8px}
  .scene small{display:block;font-size:14px;color:#8a7a66;margin-top:6px;font-weight:400}
  .course{background:var(--card);border-radius:32px;padding:30px;text-align:center;font-size:28px;font-weight:700;cursor:pointer;box-shadow:0 6px 0 var(--soft)}
  .course .big{font-size:80px;display:block}
  .course small{display:block;font-size:15px;color:#8a7a66;margin-top:8px;font-weight:400}
  .card{background:var(--card);border-radius:28px;padding:18px;text-align:center;cursor:pointer;box-shadow:0 5px 0 var(--soft);user-select:none}
  .card .em{font-size:72px;line-height:1.1}
  .big-course .card .em{font-size:52px}
  .card .ja{font-size:28px;font-weight:700;margin-top:6px}
  .card .es{font-size:16px;color:#7a6a56;margin-top:4px;min-height:22px}
  rt{font-size:.45em;font-weight:400}
  .card.good{outline:6px solid var(--ok)}
  .card.bad{animation:shake .3s}
  @keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
  .q{text-align:center;margin:18px 0}
  .msg{text-align:center;font-size:30px;font-weight:700;min-height:44px;color:var(--ok)}
  .bar{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:14px 0}
  .panel{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:16px}
  .panel.on{display:flex}
  .panel .box{background:#fff;border-radius:24px;padding:22px;max-width:420px;width:100%;font-size:17px}
  .panel label{display:flex;justify-content:space-between;align-items:center;margin:14px 0;gap:12px}
  .panel input[type=checkbox]{width:28px;height:28px}
  .panel select{font-size:17px;padding:6px}
  .hint{font-size:13px;color:#8a7a66}
  .status{display:flex;gap:16px;align-items:center;background:#fff;border-radius:24px;padding:14px 18px;margin-top:14px;box-shadow:0 5px 0 var(--soft)}
  .status .lv{display:flex;gap:10px;align-items:center}
  .status .goal{flex:1;font-weight:700}
  .barwrap{height:16px;background:#f0e6d2;border-radius:10px;overflow:hidden;margin-top:6px}
  .barfill{height:100%;background:linear-gradient(90deg,#ffb347,#ff8a3d);transition:width .4s}
  .toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);background:#3a2e22;color:#fff;padding:14px 22px;border-radius:20px;font-size:22px;font-weight:700;z-index:99;text-align:center;animation:pop .3s}
  @keyframes pop{from{transform:translateX(-50%) scale(.6);opacity:0}}
  .conf{position:fixed;top:-40px;font-size:32px;z-index:98;animation:fall 2.2s linear forwards}
  @keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
  .tag{display:inline-block;background:var(--soft);border-radius:12px;padding:2px 10px;font-size:13px;margin-left:6px}
</style>
</head>
<body>
<div id="app"></div>
<div class="panel" id="panel"><div class="box">
  <h2 style="margin-top:0">おうちのひと へ</h2>
  <label><span>おこさんの なまえ<br><span class="hint">なまえで よびかけます</span></span><input id="optName" style="font-size:17px;padding:6px;width:150px" onchange="childName=this.value.trim();try{localStorage.setItem('childName',childName)}catch(e){}"></label>
  <label><span>ぼご ヒント<br><span class="hint">母語のヒントを出す</span></span><input type="checkbox" id="optHint" checked></label>
  <label><span>ヒントの ことば<br><span class="hint">母語が決まったら増やします</span></span>
    <select id="optLang"><option value="ne">नेपाली（仮）</option><option value="es">español（仮）</option></select></label>
  <label><span>ごほうび チケット<br><span class="hint">試作では表示のみ</span></span><input type="checkbox" id="optTicket"></label>
  <label><span>よみあげの はやさ</span><input type="range" id="optRate" min="0.5" max="1.1" step="0.1" value="0.8"></label>
  <label><span>きょうの もくひょう（⭐）</span><select id="optGoal" onchange="stats.goal=+this.value;saveStats()"><option value="3">3</option><option value="5" selected>5</option><option value="10">10</option></select></label>
  <p class="hint">なれたら ヒントを オフに していきます。</p>
  <hr>
  <b>はげましの こえ</b> <span class="hint">（おうちのひとの こえを ろくおん。なければ サンプルの こえ）</span>
  <div id="voiceList"></div>
  <button class="btn ghost" id="recBtn" style="padding:8px 16px;font-size:16px" onclick="toggleRec()">🎙️ ろくおんする</button>
  <span class="hint" id="recMsg"></span>
  <hr>
  <b>みぢかな ひと</b> <span class="hint">（しゃしんは この たんまつの なかだけ。ネットには おくりません）</span>
  <div id="peopleList"></div>
  <input id="pName" placeholder="なまえ（ママ、ともだち の なまえ など）" style="width:100%;font-size:17px;padding:6px;margin:6px 0">
  <input id="pFile" type="file" accept="image/*" style="margin:6px 0">
  <button class="btn ghost" style="padding:8px 16px;font-size:16px" onclick="addPerson()">ついか</button>
  <div style="margin-top:14px"><button class="btn" onclick="closePanel()">とじる</button></div>
</div></div>

<script>
// ===== 内容データ（母語・ペルソナ確定後はここだけ差し替える）=====
// ja=表示(かな) / h=ふりがな付き表示 / say=読み上げ / tr=母語ヒント（言語コードごと）
const COURSES = {
  small: {title:"ちいさい こ", sub:"5さい〜しょうがく3ねん", em:"🧸", scenes:[
    {id:"aisatsu", title:"あいさつ", tr:{es:"Saludos",ne:"अभिवादन"}, em:"👋", items:[
      {ja:"おはよう", tr:{es:"Buenos días",ne:"शुभ प्रभात"}, em:"🌅"},
      {ja:"ありがとう", tr:{es:"Gracias",ne:"धन्यवाद"}, em:"🙏"},
      {ja:"ごめんなさい", tr:{es:"Perdón",ne:"माफ गर्नुहोस्"}, em:"🥺"},
      {ja:"いただきます", tr:{es:"A comer (antes de comer)",ne:"खाना खाने (खानुअघि)"}, em:"🍚"},
      {ja:"ごちそうさま", tr:{es:"Gracias por la comida",ne:"खाना दिएकोमा धन्यवाद"}, em:"😋"},
    ]},
    {id:"komatta", title:"こまったとき", tr:{es:"Cuando necesito ayuda",ne:"मद्दत चाहिएको बेला"}, em:"🆘", items:[
      {ja:"トイレに いきたい", tr:{es:"Quiero ir al baño",ne:"मलाई शौचालय जानु छ"}, em:"🚽"},
      {ja:"いたい", tr:{es:"Me duele",ne:"दुखिरहेको छ"}, em:"🤕"},
      {ja:"おなかが すいた", tr:{es:"Tengo hambre",ne:"मलाई भोक लाग्यो"}, em:"🍙"},
      {ja:"たすけて", tr:{es:"¡Ayuda!",ne:"मद्दत गर्नुहोस्!"}, em:"🙋"},
      {ja:"わからない", tr:{es:"No entiendo",ne:"मैले बुझिनँ"}, em:"❓"},
    ]},
    {id:"mochimono", title:"がっこうの もちもの", tr:{es:"Cosas de la escuela",ne:"स्कूलका सामान"}, em:"🎒", items:[
      {ja:"かばん", tr:{es:"Mochila",ne:"झोला"}, em:"🎒"},
      {ja:"えんぴつ", tr:{es:"Lápiz",ne:"पेन्सिल"}, em:"✏️"},
      {ja:"ノート", tr:{es:"Cuaderno",ne:"कापी"}, em:"📓"},
      {ja:"うわばき", tr:{es:"Zapatillas de interior",ne:"भित्री चप्पल"}, em:"👟"},
      {ja:"はさみ", tr:{es:"Tijeras",ne:"कैंची"}, em:"✂️"},
    ]},
    {id:"kyushoku", title:"きゅうしょく", tr:{es:"Almuerzo escolar",ne:"स्कूलको खाजा"}, em:"🍱", items:[
      {ja:"ぎゅうにゅう", tr:{es:"Leche",ne:"दूध"}, em:"🥛"},
      {ja:"ごはん", tr:{es:"Arroz",ne:"भात"}, em:"🍚"},
      {ja:"おはし", tr:{es:"Palillos",ne:"चपस्टिक"}, em:"🥢"},
      {ja:"おかわり", tr:{es:"Repetir (más comida)",ne:"थप खाना (फेरि लिनु)"}, em:"🍽️"},
      {ja:"ごちそうさま", tr:{es:"Gracias por la comida",ne:"खाना दिएकोमा धन्यवाद"}, em:"😋"},
    ]},
  ]},
  big: {title:"おおきい こ", sub:"しょうがく4ねん〜ちゅうがく", em:"🎓", scenes:[
    {id:"sansuu", title:"さんすう・すうがく", tr:{es:"Matemáticas",ne:"गणित"}, em:"🔢", items:[
      {ja:"たす", tr:{es:"Sumar",ne:"जोड्नु"}, em:"➕"},
      {ja:"ひく", tr:{es:"Restar",ne:"घटाउनु"}, em:"➖"},
      {ja:"かける", tr:{es:"Multiplicar",ne:"गुणन गर्नु"}, em:"✖️"},
      {ja:"わる", tr:{es:"Dividir",ne:"भाग गर्नु"}, em:"➗"},
      {ja:"こたえ", h:"<ruby>答<rt>こた</rt></ruby>え", say:"こたえ", tr:{es:"Respuesta",ne:"उत्तर"}, em:"✅"},
    ]},
    {id:"jugyou", title:"じゅぎょうの ことば", tr:{es:"Palabras de clase",ne:"कक्षाका शब्दहरू"}, em:"📚", items:[
      {ja:"きょうかしょ", h:"<ruby>教科書<rt>きょうかしょ</rt></ruby>", say:"きょうかしょ", tr:{es:"Libro de texto",ne:"पाठ्यपुस्तक"}, em:"📘"},
      {ja:"こくばん", h:"<ruby>黒板<rt>こくばん</rt></ruby>", say:"こくばん", tr:{es:"Pizarra",ne:"ब्ल्याकबोर्ड"}, em:"🧑‍🏫"},
      {ja:"せんせい", h:"<ruby>先生<rt>せんせい</rt></ruby>", say:"せんせい", tr:{es:"Profesor/a",ne:"शिक्षक/शिक्षिका"}, em:"👩‍🏫"},
      {ja:"しつもん", h:"<ruby>質問<rt>しつもん</rt></ruby>", say:"しつもん", tr:{es:"Pregunta",ne:"प्रश्न"}, em:"🙋"},
      {ja:"はっぴょう", h:"<ruby>発表<rt>はっぴょう</rt></ruby>", say:"はっぴょう", tr:{es:"Presentación",ne:"प्रस्तुति"}, em:"🎤"},
    ]},
    {id:"otayori", title:"がっこうの おたより", tr:{es:"Avisos de la escuela",ne:"स्कूलको सूचना"}, em:"📄", items:[
      {ja:"しゅくだい", h:"<ruby>宿題<rt>しゅくだい</rt></ruby>", say:"しゅくだい", tr:{es:"Tarea",ne:"गृहकार्य"}, em:"📝"},
      {ja:"ていしゅつ", h:"<ruby>提出<rt>ていしゅつ</rt></ruby>", say:"ていしゅつ", tr:{es:"Entregar",ne:"बुझाउनु"}, em:"📤"},
      {ja:"えんそく", h:"<ruby>遠足<rt>えんそく</rt></ruby>", say:"えんそく", tr:{es:"Excursión",ne:"शैक्षिक भ्रमण"}, em:"🥾"},
      {ja:"けっせき", h:"<ruby>欠席<rt>けっせき</rt></ruby>", say:"けっせき", tr:{es:"Ausencia",ne:"अनुपस्थिति"}, em:"🤒"},
      {ja:"もちもの", h:"<ruby>持<rt>も</rt></ruby>ち<ruby>物<rt>もの</rt></ruby>", say:"もちもの", tr:{es:"Qué llevar",ne:"के ल्याउने"}, em:"🎒"},
    ]},
  ]},
};

// ===== 状態 =====
let stars = 0, course = null, view = "home";
try{ stars = +localStorage.getItem("stars")||0 }catch(e){}
const $ = s=>document.querySelector(s);
const opt = ()=>({hint:$("#optHint").checked, lang:$("#optLang").value, ticket:$("#optTicket").checked, rate:+$("#optRate").value});
const hint = o=>{const p=opt(); return p.hint && o.tr && o.tr[p.lang] ? o.tr[p.lang] : ""};
const disp = it=>it.h||it.ja;
const say = it=>it.say||it.ja;

function speak(t){
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(t);
    u.lang="ja-JP"; u.rate=opt().rate;
    const v = speechSynthesis.getVoices().find(v=>v.lang&&v.lang.startsWith("ja"));
    if(v) u.voice=v;
    speechSynthesis.speak(u);
  }catch(e){}
}
// ===== ゲームせい：れんぞくにっすう・きょうの もくひょう・レベル・バッジ =====
// 方針：まちがえても ばつは なし。おやすみ1にち までは れんぞく キープ。もくひょうを こえたら おしまいで OK。
let stats={streak:0,last:"",today:0,todayDate:"",goal:5,badges:[]};
try{ const s=localStorage.getItem("stats"); if(s) stats=Object.assign(stats,JSON.parse(s)); }catch(e){}
function saveStats(){ try{ localStorage.setItem("stats",JSON.stringify(stats)); }catch(e){} }
function todayStr(){ return new Date().toLocaleDateString("sv-SE"); }
function rollover(){ const t=todayStr(); if(stats.todayDate!==t){ stats.todayDate=t; stats.today=0; } }
rollover();
let combo=0, lastStarAt=0;
const LEVELS=[["🥚","たまご"],["🐣","ひよこ"],["🐥","ことり"],["🐤","げんき ことり"],["🦆","あひる"],["🦢","はくちょう"],["🦜","おしゃべり おうむ"],["🦅","わし"],["🐉","ドラゴン"],["🌟","スター"]];
function levelOf(n){ const i=Math.min(Math.floor(n/15),LEVELS.length-1); return {n:i,em:LEVELS[i][0],name:LEVELS[i][1],next:(i+1)*15}; }
const BADGES=[
  {id:"first",em:"🌱",t:"はじめの いっぽ",c:()=>stars>=1},
  {id:"goal",em:"🎯",t:"きょうの もくひょう",c:()=>stats.today>=stats.goal},
  {id:"s3",em:"🔥",t:"3にち れんぞく",c:()=>stats.streak>=3},
  {id:"s7",em:"🏆",t:"7にち れんぞく",c:()=>stats.streak>=7},
  {id:"st50",em:"⭐",t:"⭐ 50こ",c:()=>stars>=50},
  {id:"st100",em:"🌟",t:"⭐ 100こ",c:()=>stars>=100},
];
function checkBadges(){ for(const b of BADGES){ if(!stats.badges.includes(b.id) && b.c()){ stats.badges.push(b.id); saveStats(); return b; } } return null; }
function starsText(){ return "🔥 "+stats.streak+" ⭐ "+stars; }
function toast(html){ const d=document.createElement("div"); d.className="toast"; d.innerHTML=html; document.body.appendChild(d); setTimeout(()=>d.remove(),2400); }
function confetti(){ const E=["🎉","⭐","✨","🎊","🌟"]; for(let i=0;i<28;i++){ const s=document.createElement("span"); s.className="conf"; s.textContent=E[i%E.length]; s.style.left=(Math.random()*95)+"vw"; s.style.animationDelay=(Math.random()*0.8)+"s"; document.body.appendChild(s); setTimeout(()=>s.remove(),3200); } }
function chime(f){ try{ const ac=new (window.AudioContext||window.webkitAudioContext)(); (f||[660,880]).forEach((hz,i)=>{ const o=ac.createOscillator(),g=ac.createGain(); o.type="sine"; o.frequency.value=hz; const t0=ac.currentTime+i*0.12; g.gain.setValueAtTime(0.15,t0); g.gain.exponentialRampToValueAtTime(0.001,t0+0.25); o.connect(g); g.connect(ac.destination); o.start(t0); o.stop(t0+0.3); }); }catch(e){} }
function statusCard(){
  rollover(); const lv=levelOf(stars); const pct=Math.min(100,Math.round(stats.today/stats.goal*100));
  return `<div class="status"><div class="lv"><span style="font-size:44px">${lv.em}</span><div><b>${lv.name}</b><div class="hint">⭐ ${stars} / ${lv.next}</div></div></div>
    <div class="goal"><div>🎯 きょうの もくひょう ${Math.min(stats.today,stats.goal)}/${stats.goal}</div><div class="barwrap"><div class="barfill" style="width:${pct}%"></div></div>${stats.today>=stats.goal?'<div class="hint">たっせい！ きょうは もう おわりでも OK 🌙</div>':''}</div>
    <button class="btn ghost" onclick="go('badges')">🏅</button></div>`;
}
function badgesView(){
  $("#app").innerHTML = header("home")+`<h1 style="margin-top:14px">🏅 バッジ</h1><div class="grid">`+BADGES.map(b=>{const on=stats.badges.includes(b.id);return `<div class="card" style="${on?'':'filter:grayscale(1);opacity:.45'}"><div class="em">${b.em}</div><div class="ja" style="font-size:20px">${b.t}</div></div>`}).join("")+`</div>`;
}
function addStar(){
  stars++; try{localStorage.setItem("stars",stars)}catch(e){}
  rollover(); stats.today++;
  const t=todayStr(); let goalHit=false;
  if(stats.today===stats.goal){
    goalHit=true;
    const d=stats.last?Math.round((Date.parse(t+"T00:00:00")-Date.parse(stats.last+"T00:00:00"))/86400000):99;
    stats.streak=(d===1||d===2)?stats.streak+1:1; stats.last=t;
  }
  saveStats();
  const now=Date.now(); combo=(now-lastStarAt<25000)?combo+1:1; lastStarAt=now;
  const s=$(".stars"); if(s) s.textContent=starsText();
  chime();
  if(goalHit){ chime([523,659,784,1047]); confetti(); toast("🎯 きょうの もくひょう たっせい！<br>🔥 "+stats.streak+"にち れんぞく"); }
  else if(combo===3||combo===5||combo===10){ toast("🔥 れんぞく せいかい ×"+combo); }
  const nb=checkBadges(); if(nb) setTimeout(()=>toast(nb.em+" バッジ「"+nb.t+"」"),goalHit?2800:800);
  const lv=levelOf(stars); if(stars>1 && levelOf(stars-1).n!==lv.n) setTimeout(()=>toast("🎉 レベルアップ！ "+lv.em+" "+lv.name),1800);
  if(goalHit){ setTimeout(()=>{ const p=pickPhrase("end"); if(p) playPhrase(p); },3200); }
  else setTimeout(cheer,1300);
}

// ===== はげましの こえ（ろくおん → この たんまつの IndexedDB に ほぞん）=====
let voices=[], rec=null, recChunks=[], lastCheer=0, recTimer=null;
const SAMPLE_CHEERS=["がんばれー！","すごいね！","できたね！","いいぞー！"];
function idb(){ return new Promise((res,rej)=>{ const r=indexedDB.open("nihongo",1);
  r.onupgradeneeded=()=>r.result.createObjectStore("voices",{keyPath:"id"});
  r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
async function loadVoices(){
  try{ const db=await idb();
    voices = await new Promise((res,rej)=>{ const q=db.transaction("voices").objectStore("voices").getAll(); q.onsuccess=()=>res(q.result); q.onerror=()=>rej(q.error); });
  }catch(e){ voices=[]; }
}
async function putVoice(blob){
  const db=await idb();
  await new Promise((res,rej)=>{ const t=db.transaction("voices","readwrite"); t.objectStore("voices").put({id:Date.now(),blob}); t.oncomplete=res; t.onerror=()=>rej(t.error); });
}
async function delVoice(id){
  try{ const db=await idb();
    await new Promise((res,rej)=>{ const t=db.transaction("voices","readwrite"); t.objectStore("voices").delete(id); t.oncomplete=res; t.onerror=()=>rej(t.error); });
  }catch(e){}
  await loadVoices(); renderVoiceList();
}
function playVoice(v){ try{ const a=new Audio(URL.createObjectURL(v.blob)); a.play().catch(()=>{}); }catch(e){} }
function cheer(){
  const now=Date.now(); if(now-lastCheer<2000) return; lastCheer=now;
  const p=pickPhrase("praise");
  if(voices.length && (!p || Math.random()<0.5)) playVoice(voices[Math.floor(Math.random()*voices.length)]);
  else if(p) playPhrase(p);
  else speak(SAMPLE_CHEERS[Math.floor(Math.random()*SAMPLE_CHEERS.length)]);
}

// ===== 日本語の シャワー =====
// 名前よびかけ・あいさつ・きせつ・はげまし。Google Cloud の こうひんしつ おんせい(audio/*.mp3)を さいせい。
// ファイルが まだ ない とき は、たんまつの こえで だいよう。
let PHRASES=[], childName="";
try{ childName=localStorage.getItem("childName")||""; }catch(e){}
try{ fetch("phrases.json").then(r=>r.json()).then(j=>{PHRASES=j}).catch(()=>{}); }catch(e){}
function nameSlug(n){ return Array.from(n).map(c=>c.codePointAt(0).toString(16)).join("-"); }
function phraseText(p){ return childName ? p.ja.split("{name}").join(childName) : p.ja.split("{name}、").join("").split("、{name}").join("").split("{name}").join(""); }
function phraseTr(p){ const t=p.tr&&p.tr[opt().lang]; if(!t) return ""; return childName ? t.split("{name}").join(childName) : t.split(", {name}").join("").split("{name}, ").join("").split("{name}").join(""); }
function clipUrl(p){ return childName ? "audio/names/"+nameSlug(childName)+"/"+p.id+".mp3" : "audio/"+p.id+".mp3"; }
function playPhrase(p){
  return new Promise(res=>{
    let done=false, failed=false;
    const fin=()=>{ if(!done){ done=true; res(); } };
    const fb=()=>{ if(failed||done) return; failed=true;
      try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(phraseText(p)); u.lang="ja-JP"; u.rate=opt().rate; u.onend=fin; u.onerror=fin; speechSynthesis.speak(u); }catch(e){ fin(); } };
    try{ const a=new Audio(clipUrl(p)); a.onended=fin; a.onerror=fb; a.play().catch(fb); }catch(e){ fb(); }
  });
}
function pickPhrase(ctx){ const l=PHRASES.filter(p=>p.ctx===ctx); return l.length?l[Math.floor(Math.random()*l.length)]:null; }
function seasonCtx(){ const m=new Date().getMonth()+1; return m>=3&&m<=5?"season-spring":m>=6&&m<=8?"season-summer":m>=9&&m<=11?"season-autumn":"season-winter"; }
function greetCtx(){ const h=new Date().getHours(); return h>=5&&h<10?"greet-morning":h>=10&&h<17?"greet-noon":"greet-evening"; }
async function ohanashi(){
  const seq=[pickPhrase(greetCtx()), pickPhrase(seasonCtx()), pickPhrase(Math.random()<0.5?"praise":"cheer")].filter(Boolean);
  for(const p of seq){
    const b=$("#bubble"); if(b){ const tr=opt().hint?phraseTr(p):""; b.innerHTML="🗨️ "+phraseText(p)+(tr?`<div class="hint">${tr}</div>`:""); }
    await playPhrase(p); await new Promise(r=>setTimeout(r,300));
  }
}
function renderVoiceList(){
  const el=$("#voiceList"); if(!el) return;
  el.innerHTML = voices.length ? voices.map((v,i)=>`<div style="display:flex;align-items:center;gap:8px;margin:4px 0"><button onclick="playVoice(voices[${i}])">▶</button><span style="flex:1">こえ ${i+1}</span><button onclick="delVoice(${v.id})">✕</button></div>`).join("") : `<div class="hint">まだ ありません（サンプルの こえが でます）</div>`;
}
async function toggleRec(){
  const btn=$("#recBtn"), msg=$("#recMsg");
  if(rec && rec.state==="recording"){ rec.stop(); return; }
  try{
    const s=await navigator.mediaDevices.getUserMedia({audio:true});
    rec=new MediaRecorder(s); recChunks=[];
    rec.ondataavailable=e=>recChunks.push(e.data);
    rec.onstop=async()=>{
      clearTimeout(recTimer); s.getTracks().forEach(t=>t.stop());
      btn.textContent="🎙️ ろくおんする"; msg.textContent="";
      try{ await putVoice(new Blob(recChunks,{type:rec.mimeType||"audio/webm"})); await loadVoices(); renderVoiceList(); }catch(e){ msg.textContent="ほぞんできませんでした"; }
    };
    rec.start(); btn.textContent="⏹️ とめる"; msg.textContent="はなしてね（8びょうまで）";
    recTimer=setTimeout(()=>{ if(rec && rec.state==="recording") rec.stop(); },8000);
  }catch(e){ msg.textContent="マイクが つかえません（https で ひらいてね）"; }
}
function shuffle(a){return a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1])}

function header(backTo){
  return `<header>
    ${backTo?`<button class="btn ghost" onclick="go('${backTo}')">← もどる</button>`:`<h1>にほんご あそび <span class="tag">試作</span></h1>`}
    <span class="stars">${starsText()}</span>
    <button class="btn ghost" onclick="openPanel()" aria-label="おうちのひと">⚙️</button>
  </header>`;
}
function go(v){
  view=v;
  if(v==="home") course=null;
  else if(v.startsWith("course:")) course=v.slice(7);
  render();
}

  const app=$("#app"); document.body.classList.toggle("teen",course==="big");
  if(view==="home"){
    app.innerHTML = header(null) + statusCard() +
      `<div style="text-align:center;margin:16px 0 4px"><button class="btn" style="font-size:24px" onclick="ohanashi()">🗨️ おはなし</button><div id="bubble" style="margin-top:10px;font-size:22px;min-height:30px"></div></div>` + `<p style="text-align:center;font-size:20px;margin-top:20px">どっちかな？</p><div class="grid">` +

  } else if(view.startsWith("course:")){

      c.scenes.map(s=>`<div class="scene" onclick="go('scene:${s.id}')"><span class="big">${s.em}</span>${s.title}${hint(s)?`<small>${hint(s)}</small>`:""}</div>`).join("") +

      `<div class="scene" style="background:#fff4d6" onclick="go('game:nazori')"><span class="big">✍️</span>ひらがな・カタカナ<small>なぞりがき</small></div><div class="scene" style="background:#fdeef4" onclick="go('game:ageyou')"><span class="big">🎁</span>あげよう<small>ゲーム（しゃしん）</small></div>
       <div class="scene" style="background:#eef3fd" onclick="go('game:manekko')"><span class="big">🎤</span>まねっこ<small>ゲーム（じぶんの こえ）</small></div></div>`;
  } else if(view.startsWith("scene:")){
    const s = findScene(view.slice(6));
    app.innerHTML = header("course:"+course) + `<h1 style="margin-top:14px">${s.em} ${s.title}</h1>
      <div class="bar"><button class="btn" onclick="go('quiz:${s.id}')">🎧 きいて えらぶ</button></div>
      <div class="grid ${course==='big'?'big-course':''}">`+ s.items.map((it,i)=>`<div class="card" onclick="tapCard(${i},'${s.id}')"><div class="em">${it.em}</div><div class="ja">${disp(it)}</div><div class="es">${hint(it)}</div></div>`).join("") + `</div>
      <p class="hint" style="text-align:center">カードを タッチすると こえが でるよ</p>`;
  } else if(view.startsWith("quiz:")){
    quiz(view.slice(5));
  } else if(view==="game:kyushoku"){
    kyushoku();
  } else if(view==="game:otayori"){
    otayori();
  } else if(view==="game:ageyou"){
    ageyou();
  } else if(view==="game:nazori"){
    nazori();
  } else if(view==="game:manekko"){
    manekko();
  } else if(view==="badges"){
    badgesView();
  }
}


// ===== ゲーム：ひらがな・カタカナ なぞりがき =====
const HIRA="あいうえおかきくけこさしすせそたちつてとなにぬねのはひふへほまみむめもやゆよらりるれろわをん";
let kanaMode="hira", kanaSel="あ";
function toKana(c){ return kanaMode==="kata" ? String.fromCharCode(c.charCodeAt(0)+0x60) : c; }
function nazori(){
  const chars=Array.from(HIRA);
  $("#app").innerHTML = header("course:"+course) + `<div style="text-align:center;margin:10px 0">
    <button class="btn ${kanaMode==='hira'?'':'ghost'}" onclick="kanaMode='hira';nazori()">ひらがな</button>
    <button class="btn ${kanaMode==='kata'?'':'ghost'}" onclick="kanaMode='kata';nazori()">カタカナ</button></div>
    <div style="display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:12px">`+
    chars.map(c=>`<button class="btn ${toKana(c)===toKana(kanaSel)?'':'ghost'}" style="font-size:22px;padding:8px 12px" onclick="kanaSel='${c}';nazori()">${toKana(c)}</button>`).join("")+`</div>
    <div style="position:relative;width:min(80vw,320px);height:min(80vw,320px);margin:0 auto;background:#fff;border-radius:24px;box-shadow:0 5px 0 var(--soft)">
      <canvas id="cg" width="640" height="640" style="position:absolute;inset:0;width:100%;height:100%"></canvas>
      <canvas id="cd" width="640" height="640" style="position:absolute;inset:0;width:100%;height:100%;touch-action:none"></canvas></div>
    <div style="text-align:center;margin-top:12px"><button class="btn ghost" id="nz-say">🔊</button> <button class="btn ghost" id="nz-clr">けす</button> <button class="btn" id="nz-ok">できた！</button></div>
    <div class="msg" id="msg"></div>`;
  const ch=toKana(kanaSel);
  const g=$("#cg").getContext("2d"); g.font="500px 'Hiragino Maru Gothic ProN','Yu Gothic',sans-serif"; g.textAlign="center"; g.textBaseline="middle"; g.fillStyle="#e6e0d6"; g.fillText(ch,320,350);
  const cv=$("#cd"), d=cv.getContext("2d"); d.lineWidth=26; d.lineCap="round"; d.lineJoin="round"; d.strokeStyle="#3a2e22";
  let down=false, ink=0;
  const pt=e=>{const r=cv.getBoundingClientRect(); return [(e.clientX-r.left)*640/r.width,(e.clientY-r.top)*640/r.height]};
  cv.onpointerdown=e=>{down=true;cv.setPointerCapture(e.pointerId);const [x,y]=pt(e);d.beginPath();d.moveTo(x,y);d.lineTo(x+0.1,y);d.stroke();ink++};
  cv.onpointermove=e=>{if(!down)return;const [x,y]=pt(e);d.lineTo(x,y);d.stroke();ink++};
  cv.onpointerup=cv.onpointercancel=()=>{down=false};
  $("#nz-clr").onclick=()=>{d.clearRect(0,0,640,640);ink=0};
  $("#nz-say").onclick=()=>speak(ch);
  $("#nz-ok").onclick=()=>{
    if(ink<8){ $("#msg").textContent="なぞって みよう！"; return; }
    $("#msg").textContent="じょうず！"; addStar();
    const i=(Array.from(HIRA).indexOf(kanaSel)+1)%HIRA.length; setTimeout(()=>{kanaSel=Array.from(HIRA)[i];nazori()},1500);
  };
  speak(ch);
}

// ===== ゲーム：まねっこ（おてほんを きいて、じぶんの こえで いう → きいて くらべる）=====
// ろくおんは この たんまつの メモリ だけ。ほぞんも おくりも しない。
function manekko(){
  const pool = COURSES[course].scenes.flatMap(s=>s.items);
  const it = pool[Math.floor(Math.random()*pool.length)];
  let mine = null, recorder = null;
  $("#app").innerHTML = header("course:"+course) +
    `<h1 style="margin-top:14px">🎤 まねっこ</h1>
     <div class="grid" style="grid-template-columns:minmax(220px,360px);justify-content:center"><div class="card"><div class="em">${it.em}</div><div class="ja">${disp(it)}</div><div class="es">${hint(it)}</div></div></div>
     <div class="msg" id="msg" style="margin-top:14px"></div>
     <div class="bar">
       <button class="btn" id="model">🔊 おてほん</button>
       <button class="btn" id="mic" style="background:#4a7be0;box-shadow:0 4px 0 #2f57a8">🎙️ いってみよう</button>
       <button class="btn ghost" id="mine" disabled>▶ じぶんの こえ</button>
       <button class="btn ghost" id="next">つぎ →</button>
     </div>`;
  $("#model").onclick = ()=>speak(say(it));
  setTimeout(()=>speak(say(it)),300);
  $("#next").onclick = manekko;
  $("#mine").onclick = ()=>{ if(mine){ try{ new Audio(URL.createObjectURL(mine)).play(); }catch(e){} } };
  $("#mic").onclick = async ()=>{
    if(recorder && recorder.state==="recording") return;
    try{
      const s = await navigator.mediaDevices.getUserMedia({audio:true});
      const chunks=[]; recorder = new MediaRecorder(s);
      recorder.ondataavailable=e=>chunks.push(e.data);
      recorder.onstop=()=>{
        s.getTracks().forEach(t=>t.stop());
        mine = new Blob(chunks,{type:recorder.mimeType||"audio/webm"});
        $("#mine").disabled=false; $("#msg").textContent="じょうず！ きいてみよう"; addStar();
        setTimeout(()=>{ try{ new Audio(URL.createObjectURL(mine)).play(); }catch(e){} },900);
      };
      recorder.start(); $("#msg").style.color="#c96a25"; $("#msg").textContent="🔴 いってね…";
      setTimeout(()=>{ if(recorder.state==="recording") recorder.stop(); $("#msg").style.color=""; },3000);
    }catch(e){ $("#msg").style.color="#c96a25"; $("#msg").textContent="マイクが つかえません"; }
  };
}

// ===== みぢかな ひと（しゃしんは この たんまつの なかだけ。ネットには おくらない）=====
let people = [{id:1,name:"ママ",em:"👩"},{id:2,name:"パパ",em:"👨"}];
try{ const s=localStorage.getItem("people"); if(s) people=JSON.parse(s); }catch(e){}
function savePeople(){ try{ localStorage.setItem("people",JSON.stringify(people)); }catch(e){} }
function avatar(p,s){ return p.photo?`<img src="${p.photo}" style="width:${s}px;height:${s}px;border-radius:50%;object-fit:cover">`:`<span style="font-size:${s*0.8}px">${p.em||"🙂"}</span>`; }
function renderPeopleList(){
  $("#peopleList").innerHTML = people.map(p=>`<div style="display:flex;align-items:center;gap:8px;margin:4px 0">${avatar(p,40)}<span style="flex:1">${p.name}</span><button onclick="delPerson(${p.id})">✕</button></div>`).join("");
}
function addPerson(){
  const name=$("#pName").value.trim(); if(!name) return;
  const f=$("#pFile").files[0];
  const done=photo=>{ people.push({id:Date.now(),name,photo}); savePeople(); $("#pName").value=""; $("#pFile").value=""; renderPeopleList(); };
  if(!f){ done(null); return; }
  const rd=new FileReader();
  rd.onload=()=>{ const img=new Image(); img.onload=()=>{
      const c=document.createElement("canvas"); c.width=c.height=480;
      const s=Math.min(img.width,img.height);
      c.getContext("2d").drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,480,480);
      done(c.toDataURL("image/jpeg",0.8)); };
    img.src=rd.result; };
  rd.readAsDataURL(f);
}
function delPerson(id){ people=people.filter(p=>p.id!==id); savePeople(); renderPeopleList(); }

// ===== ゲーム：あげよう（「ままに きょうかしょを あげよう」）=====
const GIFTS=[{n:"きょうかしょ",em:"📘"},{n:"えんぴつ",em:"✏️"},{n:"ノート",em:"📓"},{n:"おべんとう",em:"🍱"},{n:"ぎゅうにゅう",em:"🥛"},{n:"はさみ",em:"✂️"}];
function ageyou(){
  if(!people.length){ $("#app").innerHTML=header("course:"+course)+`<p style="text-align:center;font-size:20px;margin-top:30px">⚙️ から ひとを ふやしてね</p>`; return; }
  const p = people[Math.floor(Math.random()*people.length)];
  const g = GIFTS[Math.floor(Math.random()*GIFTS.length)];
  const items = shuffle([g,...shuffle(GIFTS.filter(x=>x!==g)).slice(0,2)]);
  const text = p.name+"に "+g.n+"を あげよう";
  let selected = null;
  $("#app").innerHTML = header("course:"+course) +
    `<h1 style="margin-top:14px">🎁 あげよう</h1>
     <div style="text-align:center;font-size:28px;font-weight:700;margin:12px 0">${text}</div>
     <div class="bar"><button class="btn ghost" id="again">🔊 もういちど</button></div>
     <div class="msg" id="msg"></div>
     <div class="grid" id="items">`+items.map((x,i)=>`<div class="card" data-n="${x.n}"><div class="em">${x.em}</div><div class="ja">${x.n}</div></div>`).join("")+`</div>
     <p style="text-align:center;margin:18px 0 0;font-size:18px">⬇️ だれに？</p>
     <div class="grid" id="people">`+people.map(q=>`<div class="card" data-id="${q.id}"><div style="height:190px;display:flex;align-items:center;justify-content:center">${avatar(q,180)}</div><div class="ja">${q.name}</div></div>`).join("")+`</div>`;
  const say1 = ()=>speak(text.replace("あげよう","あげてください"));
  $("#again").onclick = say1;
  setTimeout(say1, 300);
  document.querySelectorAll("#items .card").forEach(el=>{
    el.onclick=()=>{
      document.querySelectorAll("#items .card").forEach(x=>x.style.outline="");
      selected=el.dataset.n; el.style.outline="6px solid var(--accent)"; speak(selected);
    };
  });
  document.querySelectorAll("#people .card").forEach(el=>{
    el.onclick=()=>{
      const ok = selected===g.n && +el.dataset.id===p.id;
      if(ok){
        el.classList.add("good"); $("#msg").style.color=""; $("#msg").textContent=p.name+"「ありがとう！」🎉";
        speak(p.name+"、ありがとう！"); addStar(); setTimeout(ageyou, 2200);
      } else {
        el.classList.add("bad"); setTimeout(()=>el.classList.remove("bad"),400);
        $("#msg").style.color="#c96a25"; $("#msg").textContent = selected? "あれ？ もういちど きいてみよう" : "さきに ものを えらんでね"; say1();
      }
    };
  });
}

// ===== ゲーム：きゅうしょく とうばん（先生の指示を聞いて、おぼんに のせる）=====
const FOODS = [
  {n:"ぎゅうにゅう", em:"🥛", tr:{es:"Leche",ne:"दूध"}},
  {n:"ごはん", em:"🍚", tr:{es:"Arroz",ne:"भात"}},
  {n:"おはし", em:"🥢", tr:{es:"Palillos",ne:"चपस्टिक"}},
  {n:"みそしる", em:"🍲", tr:{es:"Sopa de miso",ne:"मिसो सुप"}},
  {n:"サラダ", em:"🥗", tr:{es:"Ensalada",ne:"सलाद"}},
  {n:"くだもの", em:"🍎", tr:{es:"Fruta",ne:"फलफूल"}},
];
function kyushoku(){
  const order = shuffle(FOODS).slice(0,3);
  const tray = [];
  let step = 0;
  const cmd = f => f.n + "を おぼんに のせてください";
  function draw(){
    const target = order[step];
    $("#app").innerHTML = header("course:small") +
      `<h1 style="margin-top:14px">🍱 きゅうしょく とうばん</h1>
       <div class="q"><button class="btn" id="again">👩‍🏫 🔊 せんせいの ことば</button></div>
       <div class="msg" id="msg"></div>
       <div id="tray" style="text-align:center;font-size:56px;min-height:90px;background:#fff;border-radius:24px;padding:10px;margin:10px 0;box-shadow:0 5px 0 var(--soft)">🍽️ ${tray.map(t=>t.em).join(" ")}</div>
       <div class="grid" id="choices">` +
      shuffle(FOODS).map(f=>`<div class="card" data-n="${f.n}"><div class="em">${f.em}</div><div class="es">${hint(f)}</div></div>`).join("") + `</div>`;
    $("#again").onclick = ()=>speak(cmd(target));
    setTimeout(()=>speak(cmd(target)), 300);
    document.querySelectorAll("#choices .card").forEach(el=>{
      el.onclick = ()=>{
        if(el.dataset.n===target.n){
          tray.push(target); step++;
          if(step>=order.length){
            $("#tray").textContent = "🍽️ " + tray.map(t=>t.em).join(" ");
            $("#msg").textContent="できた！ いただきます！🎉";
            speak("できた！ いただきます！"); addStar(); addStar();
            setTimeout(kyushoku, 3500);
          } else { speak("そう！"); setTimeout(draw, 700); }
        } else {
          el.classList.add("bad"); setTimeout(()=>el.classList.remove("bad"),400);
          speak(cmd(target));
        }
      };
    });
  }
  draw();
}
function findScene(id){ return COURSES[course].scenes.find(x=>x.id===id) }
function tapCard(i,sid){ speak(say(findScene(sid).items[i])); }

function quiz(sid){
  const s = findScene(sid);
  const answer = s.items[Math.floor(Math.random()*s.items.length)];
  const others = shuffle(s.items.filter(x=>x!==answer)).slice(0,2);
  const choices = shuffle([answer,...others]);
  const big = course==="big";
  $("#app").innerHTML = header("scene:"+sid) + `<div class="q"><button class="btn" id="again">🔊 もういちど きく</button></div>
    <div class="msg" id="msg"></div>
    <div class="grid ${big?'big-course':''}" id="choices">` + choices.map(c=>`<div class="card" data-ok="${c===answer?1:0}"><div class="em">${c.em}</div>${big?`<div class="ja">${disp(c)}</div>`:""}<div class="es">${hint(c)}</div></div>`).join("") + `</div>`;
  $("#again").onclick=()=>speak(say(answer));
  setTimeout(()=>speak(say(answer)),300);
  document.querySelectorAll("#choices .card").forEach(el=>{
    el.onclick=()=>{
      if(el.dataset.ok==="1"){
        el.classList.add("good"); $("#msg").textContent="すごい！"; speak("すごい！"+say(answer)); addStar();
        setTimeout(()=>quiz(sid),1800);
      }else{
        el.classList.add("bad"); setTimeout(()=>el.classList.remove("bad"),400);
        $("#msg").style.color="#c96a25"; $("#msg").textContent="もういちど！"; setTimeout(()=>{$("#msg").style.color="";},600);
        speak(say(answer));
      }
    };
  });
}
