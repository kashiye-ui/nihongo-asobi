<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#4a8df0">
<link rel="manifest" href="manifest.webmanifest" crossorigin="use-credentials">
<link rel="icon" href="icon-192.png">
<title>にほんご あそび（試作）</title>
<style>
  :root{--bg:#171a3d;--ink:#2a2540;--accent:#3ddc97;--ad:#1f9c68;--ok:#4be3a0;--card:#ffffff;--soft:#dcd8f0;--gold:#ffc83d;--gd:#c99700;--mut:#a9b0e0}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;min-height:100%;color:#fff;font-family:"Hiragino Maru Gothic ProN","Yu Gothic UI","Noto Sans JP","Noto Sans CJK JP",system-ui,sans-serif;font-weight:700}
  body{background:radial-gradient(900px 500px at 15% -10%,#3b3f9e66,transparent 60%),radial-gradient(700px 500px at 100% 10%,#7a3fb066,transparent 60%),linear-gradient(#171a3d,#10122c);background-attachment:fixed}
  #app{max-width:1100px;margin:0 auto;padding:14px 18px 40px;min-height:100vh}
  header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
  .brand{display:flex;align-items:center;gap:10px}.brand .logo{width:44px;height:44px;border-radius:14px;background:linear-gradient(#ffd96b,#ffb020);display:grid;place-items:center;font-size:26px;box-shadow:0 4px 0 #c98200}
  .brand b{font-size:20px;display:block;line-height:1.1}.brand small{font-size:11px;color:var(--mut);font-weight:700;letter-spacing:.1em}
  .hud{display:flex;align-items:center;gap:10px}
  .stars{background:#ffffff18;border:2px solid #ffffff26;border-radius:999px;padding:6px 16px;font-size:18px;font-weight:800}
  .gear{padding:6px 12px !important;font-size:20px !important}
  h1{font-size:clamp(22px,4vw,30px);margin:6px 0}h2{margin:6px 0}
  .btn{border:0;border-radius:18px;padding:14px 24px;font:inherit;font-size:20px;font-weight:800;background:var(--accent);color:#0c3b27;cursor:pointer;box-shadow:0 5px 0 var(--ad);letter-spacing:.02em}
  .btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ad)}
  .btn.ghost{background:#ffffff1c;color:#fff;box-shadow:0 4px 0 #00000040;border:2px solid #ffffff2e}
  .btn.ghost:active{box-shadow:0 1px 0 #00000040}
  .btn.big{font-size:24px;padding:18px 30px;width:100%}
  .btn.pink{background:#ff6b9d;color:#fff;box-shadow:0 5px 0 #c93d72}
  .scene,.course,.card{word-break:keep-all;overflow-wrap:break-word;color:var(--ink)}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-top:18px}
  .scene{background:var(--card);border-radius:26px;padding:22px;text-align:center;font-size:24px;font-weight:800;cursor:pointer;box-shadow:0 6px 0 var(--soft)}
  .scene .big{font-size:60px;display:block;margin-bottom:8px}
  .scene small{display:block;font-size:14px;color:#8a7a9a;margin-top:6px;font-weight:700}
  .card{background:var(--card);border-radius:26px;padding:18px;text-align:center;cursor:pointer;box-shadow:0 6px 0 var(--soft);user-select:none;transition:transform .12s}
  .card:active{transform:translateY(4px);box-shadow:0 2px 0 var(--soft)}
  .card .em{font-size:72px;line-height:1.1}
  .big-course .card .em{font-size:52px}
  .card .ja{font-size:28px;font-weight:800;margin-top:6px}
  .card .es{font-size:16px;color:#7a6f92;margin-top:4px;min-height:22px}
  rt{font-size:.45em;font-weight:400}
  .card.good{outline:6px solid var(--ok);transform:scale(1.04)}
  .card.bad{animation:shake .3s}
  @keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
  .q{text-align:center;margin:18px 0}
  .msg{text-align:center;font-size:28px;font-weight:800;min-height:40px;color:var(--ok)}
  .bar{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:14px 0}
  .panel{position:fixed;inset:0;background:rgba(5,6,20,.7);display:none;align-items:center;justify-content:center;padding:16px;z-index:200}
  .panel.on{display:flex}
  .panel .box{background:#fff;color:var(--ink);border-radius:24px;padding:22px;max-width:440px;width:100%;font-size:17px;max-height:92vh;overflow:auto}
  .panel label{display:flex;justify-content:space-between;align-items:center;margin:14px 0;gap:12px}
  .panel input[type=checkbox]{width:28px;height:28px}
  .panel select{font-size:17px;padding:6px}
  .panel .btn.ghost{color:var(--ink);background:#f1eefb;border-color:#d9d3ee}
  .hint{font-size:13px;color:var(--mut);font-weight:700}
  .scene .hint,.card .hint,.panel .hint{color:#8a7a9a}
  .toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);background:#fff;color:var(--ink);padding:14px 22px;border-radius:20px;font-size:22px;font-weight:800;z-index:300;text-align:center;animation:pop .3s;box-shadow:0 6px 0 #0004}
  @keyframes pop{from{transform:translateX(-50%) scale(.6);opacity:0}}
  .conf{position:fixed;top:-40px;font-size:32px;z-index:250;animation:fall 2.2s linear forwards}
  @keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
  .tag{display:inline-block;background:#ffffff22;border-radius:12px;padding:2px 10px;font-size:13px;margin-left:6px}
  /* ---- home ---- */
  .home{display:grid;grid-template-columns:minmax(300px,400px) 1fr;gap:22px;align-items:start}
  @media(max-width:820px){.home{grid-template-columns:1fr}}
  .stagecol{position:sticky;top:12px}
  @media(max-width:820px){.stagecol{position:static}}
  @media(max-width:820px){.stage{aspect-ratio:16/10}.stage .petw{width:38%;bottom:7%}.stage .win{width:16%}}
  .stage{position:relative;border-radius:30px;overflow:hidden;aspect-ratio:4/4.3;background:linear-gradient(#6f8bff,#a9c1ff 58%,#e9c58d 58%,#d9a867);box-shadow:0 8px 0 #0004,inset 0 0 0 4px #ffffff40}
  .stage .win{position:absolute;left:8%;top:7%;width:25%;aspect-ratio:1;background:linear-gradient(#bfe3ff,#e8f6ff);border:6px solid #fff;border-radius:18px;display:grid;place-items:center;font-size:clamp(26px,5vw,40px);box-shadow:0 3px 0 #0003}
  .stage .shelf{position:absolute;right:7%;top:12%;font-size:30px;letter-spacing:6px;opacity:.95}
  .stage .shelf:after{content:"";display:block;height:8px;border-radius:4px;background:#b9854a;margin-top:2px;box-shadow:0 3px 0 #0002}
  .stage .rug{position:absolute;left:50%;bottom:7%;width:74%;height:20%;transform:translateX(-50%);background:radial-gradient(ellipse,#ff9db8,#ff6b9d);border-radius:50%;box-shadow:inset 0 0 0 6px #ffffff55}
  .stage .petw{position:absolute;left:50%;bottom:9%;width:62%;transform:translateX(-50%);cursor:pointer}
  .bubble{position:absolute;left:50%;top:6%;transform:translateX(-12%);max-width:62%;background:#fff;color:var(--ink);border-radius:20px;padding:10px 14px;font-size:clamp(15px,2.2vw,19px);font-weight:800;box-shadow:0 4px 0 #0003;line-height:1.35}
  .bubble:after{content:"";position:absolute;left:22px;bottom:-12px;border:10px solid transparent;border-top-color:#fff;border-bottom:0}
  .pet svg{width:100%;height:auto;display:block;overflow:visible}
  .pet .body{animation:bob 2.6s ease-in-out infinite;transform-origin:50% 100%}
  .pet .tail{animation:wag .5s ease-in-out infinite alternate;transform-origin:150px 150px}
  .pet .eyes{animation:blink 4.5s infinite;transform-origin:100px 100px}
  @keyframes bob{50%{transform:translateY(-4px) scale(1.01,.99)}}
  @keyframes wag{from{transform:rotate(-14deg)}to{transform:rotate(16deg)}}
  @keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
  .pet.hop .body{animation:hop .5s ease-out}
  @keyframes hop{30%{transform:translateY(-26px)}60%{transform:translateY(0) scale(1.05,.95)}}
  .petcard{background:#ffffff14;border:2px solid #ffffff22;border-radius:22px;padding:12px 16px;margin-top:12px;display:flex;align-items:center;gap:12px}
  .petcard .nm{font-size:20px;font-weight:800}
  .meter{height:12px;background:#ffffff26;border-radius:8px;overflow:hidden;margin-top:6px}.meter i{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,#ff9db8,#ff6b9d)}
  .stagebtns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
  .mission{background:linear-gradient(135deg,#2d3fbf,#6a3fd0);border-radius:26px;padding:18px 20px;box-shadow:0 7px 0 #1a1f6e,inset 0 0 0 2px #ffffff30}
  .mission .t{font-size:14px;color:#cfd6ff;letter-spacing:.08em}
  .mission .g{font-size:24px;margin:4px 0 10px;font-weight:800}
  .barwrap{height:16px;background:#00000040;border-radius:10px;overflow:hidden}
  .barfill{height:100%;background:linear-gradient(90deg,#ffe27a,#ffb020);border-radius:10px;transition:width .5s}
  .mission .btn{margin-top:14px}
  .unit{margin:26px 0 6px;padding:12px 18px;border-radius:18px;color:#fff;font-size:19px;font-weight:800;display:flex;justify-content:space-between;align-items:center}
  .unit small{font-size:13px;opacity:.85;font-weight:700}
  .u-w{background:linear-gradient(90deg,#2f7bff,#4cb0ff);box-shadow:0 5px 0 #1d4fae}
  .u-s{background:linear-gradient(90deg,#ff5f93,#ff8fb0);box-shadow:0 5px 0 #b93063}
  .u-g{background:linear-gradient(90deg,#8b5cf6,#b08cff);box-shadow:0 5px 0 #5a35b8}
  .path{display:flex;flex-direction:column;align-items:center;padding:8px 0 4px}
  .node{position:relative;text-align:center;cursor:pointer;margin:8px 0 6px;--nc:#4c9bff;--nd:#2559b8;width:160px}
  .node.s{--nc:#ff6b9d;--nd:#b93063}.node.g{--nc:#9b6bff;--nd:#5a35b8}
  .node.done{--nc:#ffc83d;--nd:#c99700}
  .node .c{width:92px;height:92px;margin:0 auto;border-radius:50%;display:grid;place-items:center;font-size:44px;background:var(--nc);box-shadow:0 8px 0 var(--nd),inset 0 5px 0 #ffffff55,inset 0 -5px 0 #00000020;transition:transform .1s}
  .node.g .c{border-radius:28px}
  .node:active .c{transform:translateY(6px);box-shadow:0 2px 0 var(--nd),inset 0 5px 0 #ffffff55}
  .node b{display:block;font-size:15px;margin-top:14px;line-height:1.25}
  .node .chk{position:absolute;left:calc(50% + 24px);top:-6px;width:30px;height:30px;border-radius:50%;background:#34c759;border:3px solid #171a3d;display:grid;place-items:center;font-size:15px;color:#fff}
  .node.cur .c{animation:pulse 1.5s ease-in-out infinite}
  @keyframes pulse{0%,100%{box-shadow:0 8px 0 var(--nd),0 0 0 0 #ffffffaa,inset 0 5px 0 #ffffff55}50%{box-shadow:0 8px 0 var(--nd),0 0 0 14px #ffffff00,inset 0 5px 0 #ffffff55}}
  .node .go{position:absolute;left:50%;top:-22px;transform:translateX(-50%);background:#fff;color:var(--ink);font-size:13px;font-weight:800;padding:3px 12px;border-radius:12px;animation:float 1.2s ease-in-out infinite;white-space:nowrap}
  .node .go:after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;border-top-color:#fff;border-bottom:0}
  @keyframes float{50%{transform:translate(-50%,-5px)}}
  /* ---- lesson ---- */
  .lhead{display:flex;align-items:center;gap:12px;margin-bottom:14px}
  .lhead .x{border:0;background:#ffffff1c;color:#fff;width:44px;height:44px;border-radius:50%;font-size:20px;font-weight:800;cursor:pointer}
  .pbar{flex:1;height:18px;background:#ffffff24;border-radius:10px;overflow:hidden}
  .pbar i{display:block;height:100%;background:linear-gradient(90deg,#6df0b0,#3ddc97);border-radius:10px;transition:width .4s;box-shadow:inset 0 4px 0 #ffffff55}
  .cheerbox{position:fixed;left:12px;bottom:90px;z-index:60;display:flex;gap:10px;align-items:center;background:#fff;color:#2a2547;border-radius:20px;padding:10px 14px;box-shadow:0 6px 20px rgba(0,0,0,.35);font-size:16px;max-width:80vw;transform:translateY(30px);opacity:0;transition:.3s}
  .cheerbox.on{transform:none;opacity:1}
  .banner{display:block;width:100%;max-width:560px;max-height:190px;margin:6px auto;border-radius:18px;object-fit:cover;box-shadow:0 4px 14px rgba(0,0,0,.3)}
  .qtitle{text-align:center;font-size:22px;color:var(--mut);margin:6px 0}
  .qsent{text-align:center;font-size:26px;font-weight:800;line-height:1.5;margin:10px 8px 2px}
  .qsent .blank{display:inline-block;min-width:3em;border-bottom:4px solid #e0a82e;color:#e0a82e}
  .qtr{text-align:center;font-size:16px;color:var(--mut);margin:0 8px 6px}
  .sheet .exs{margin-top:6px;font-size:18px;line-height:1.5}
  .sheet .exs b{color:#e0a82e}
  .spk{display:block;margin:10px auto;width:120px;height:120px;border-radius:50%;border:0;font-size:52px;cursor:pointer;background:linear-gradient(#5cb0ff,#2f7bff);box-shadow:0 8px 0 #1d4fae,inset 0 5px 0 #ffffff55;color:#fff}
  .spk:active{transform:translateY(6px);box-shadow:0 2px 0 #1d4fae}
  .dlg{display:flex;align-items:flex-end;gap:14px;max-width:760px;margin:20px auto 10px}
  .av{flex:none;width:110px;height:110px;border-radius:50%;background:linear-gradient(#fff,#e6e0ff);display:grid;place-items:center;font-size:66px;box-shadow:0 6px 0 #0004}
  .av.pet{padding:8px}
  .who{text-align:center;font-size:14px;color:var(--mut);margin-top:6px}
  .say{position:relative;flex:1;background:#fff;color:var(--ink);border-radius:26px;border-bottom-left-radius:6px;padding:20px 24px;font-size:clamp(22px,3.4vw,30px);font-weight:800;line-height:1.5;cursor:pointer;box-shadow:0 6px 0 #0004}
  .say .hint{display:block;font-size:17px;margin-top:8px;color:#7a6f92;font-weight:700}
  .chips{text-align:center;max-width:760px;margin:6px auto}
  .chip{border:0;font:inherit;font-size:16px;font-weight:800;margin:4px;padding:8px 14px;border-radius:14px;background:#ffffff1f;color:#fff;border:2px solid #ffffff2e;cursor:pointer}
  .choice{background:#fff;color:var(--ink);border-radius:22px;padding:18px 22px;margin:12px auto;max-width:760px;font-size:26px;font-weight:800;cursor:pointer;box-shadow:0 6px 0 var(--soft);text-align:left}
  .choice:active{transform:translateY(4px);box-shadow:0 2px 0 var(--soft)}
  .choice .hint{display:block;font-size:16px;margin-top:6px}
  .choice.good{outline:5px solid var(--ok)}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:260;padding:20px 24px 26px;animation:up .28s ease-out;display:flex;align-items:center;justify-content:center;gap:24px;flex-wrap:wrap}
  .sheet.ok{background:#d7ffe6;color:#0c6b3f}.sheet.ng{background:#ffe0e0;color:#a31d1d}
  .sheet .tt{font-size:28px;font-weight:800}.sheet .sb{font-size:17px;font-weight:700;margin-top:4px;max-width:520px}
  .sheet .btn{min-width:180px}
  .sheet.ng .btn{background:#ff5a5a;box-shadow:0 5px 0 #b82a2a;color:#fff}
  @keyframes up{from{transform:translateY(100%)}}
  .clear{text-align:center;margin-top:30px}
  .clear .pet{width:200px;margin:0 auto}
  .clear h2{font-size:34px}
  .xp{display:inline-block;background:#ffffff1c;border:2px solid #ffffff2e;border-radius:18px;padding:10px 22px;font-size:26px;margin:10px}
  #tray{color:var(--ink)}
  .msg:not(:empty){background:#ffffff1c;border-radius:16px;padding:8px 18px;display:table;margin:10px auto}
  .gt{margin:6px 0 14px}
  .paper{background:#fffdf5;color:var(--ink);border:3px dashed #d9c9a3;border-radius:20px;padding:20px;font-size:26px;line-height:2.2;margin:14px 0;box-shadow:0 6px 0 #0004}
  .paper .hint{color:#8a7a9a}
  .clear .pet .body{animation:cheer .7s ease-in-out infinite}
  @keyframes cheer{50%{transform:translateY(-20px) scale(1.03,.97)}}
  .fx{position:fixed;left:50%;top:38%;z-index:310;font-size:44px;font-weight:800;color:#ffd84a;text-shadow:0 4px 0 #0006;pointer-events:none;animation:rise 1s ease-out forwards}
  @keyframes rise{from{transform:translate(-50%,0) scale(.5);opacity:0}20%{opacity:1;transform:translate(-50%,-10px) scale(1.2)}to{transform:translate(-50%,-90px) scale(1);opacity:0}}
  .stars.bump{animation:bump .4s}
  @keyframes bump{40%{transform:scale(1.25);background:#ffd84a55}}
  .paperc{position:fixed;top:-20px;width:10px;height:16px;z-index:250;animation:fall 2.4s linear forwards}

  #rot{display:none}
  @media (orientation:portrait) and (max-width:1000px){#rot{position:fixed;inset:0;z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:#171a3d;font-size:28px;text-align:center}#rot b{font-size:64px;display:block}}
  #app{max-width:1200px}
  /* へや と ペット（ぜんしん・うろうろ） */
  .room{position:relative;border-radius:28px;overflow:hidden;height:min(54vh,430px);background:linear-gradient(#6f8bff,#a9c1ff 58%,#e9c58d 58%,#d9a867);box-shadow:0 8px 0 #0004,inset 0 0 0 4px #ffffff40}
  .room.wide{height:min(42vh,330px)}
  .room .rwin{position:absolute;left:7%;top:7%;width:15%;aspect-ratio:1;background:linear-gradient(#bfe3ff,#e8f6ff);border:6px solid #fff;border-radius:18px;display:grid;place-items:center;font-size:34px}
  .room .rfloor{position:absolute;left:0;right:0;bottom:0;height:42%;background:repeating-linear-gradient(90deg,#00000008 0 60px,#0000 60px 120px)}
  .room .rpet{position:absolute;bottom:5%;left:50%;height:var(--ph);transform:translateX(-50%);transition-property:left;transition-timing-function:linear;cursor:pointer}
  .room .rflip{height:100%;transition:transform .2s}
  .room .rpet img,.room .rpet .pet3e{height:100%;width:auto;display:block;filter:drop-shadow(0 8px 6px #0003)}
  .room .rpet.walk img{animation:stepw .45s ease-in-out infinite}
  @keyframes stepw{50%{transform:translateY(-7%) rotate(2deg)}}
  .room .rpet.hop img{animation:hop .5s ease-out}
  .room .bubble{left:auto;right:5%;top:6%;transform:none;max-width:48%}
  .petcard2{display:flex;align-items:center;gap:12px;margin-top:10px;background:#ffffff18;border-radius:20px;padding:10px 14px}
  .petcard2 .nm{font-size:22px}.petcard2 small{display:block;color:var(--mut);font-weight:700}
  .meter{height:12px;background:#ffffff30;border-radius:8px;overflow:hidden;margin-top:6px}.meter i{display:block;height:100%;background:var(--ok)}
  /* タイトル */
  .title{display:grid;grid-template-columns:1.15fr 1fr;gap:26px;align-items:center;min-height:calc(100vh - 40px)}
  .title h1{font-size:clamp(34px,5vw,54px);margin:0;line-height:1.1}
  .title .logoRow{display:flex;align-items:center;gap:12px}.title .logo{font-size:52px}
  .title .tag{font-size:21px;margin:10px 0 14px}
  .petopts{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px}
  .petopts button{font-size:26px;padding:4px 10px;border-radius:14px;border:2px solid transparent;background:#ffffff1c;cursor:pointer}
  .petopts button.on{border-color:var(--accent)}
  .petopts input{font-size:20px;width:140px;text-align:center;border:0;border-bottom:2px solid var(--accent);background:transparent;color:#fff;font-family:inherit;font-weight:800}
  .how{display:grid;gap:10px;background:#ffffff14;border-radius:24px;padding:16px 18px}
  .how div{display:flex;gap:12px;align-items:center;font-size:19px}.how .n{font-size:30px}.how small{display:block;color:var(--mut);font-weight:700;font-size:14px}
  .prog{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}
  .prog div{background:#ffffff18;border-radius:18px;padding:10px 6px;text-align:center;font-size:13px;color:var(--mut)}.prog b{display:block;font-size:24px;color:#fff;margin-bottom:2px}
  .startbtn{font-size:34px!important;padding:22px!important}
  .smallrow{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap}.smallrow .btn{font-size:16px;padding:10px 16px}
  /* ホーム（ミッション） */
  .home2{display:grid;grid-template-columns:minmax(300px,36%) 1fr;gap:22px;align-items:start}
  .mhead{display:flex;justify-content:space-between;align-items:baseline}.mhead h2{margin:0;font-size:28px}.mhead span{font-size:26px;color:var(--gold)}
  .msub{color:var(--mut);margin:4px 0 12px;font-size:16px}
  .msteps{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
  .mstep{position:relative;background:#ffffff18;border-radius:20px;padding:26px 6px 10px;text-align:center;cursor:pointer;border:3px solid transparent;min-height:130px}
  .mstep .no{position:absolute;left:8px;top:8px;width:26px;height:26px;border-radius:50%;background:#ffffff30;display:grid;place-items:center;font-size:15px}
  .mstep .e{font-size:40px}.mstep b{display:block;font-size:16px;margin-top:2px}.mstep small{display:block;color:var(--mut);font-size:12px;font-weight:700;margin-top:2px}
  .mstep.cur{background:linear-gradient(#3b4fd8,#6a3fd0);border-color:var(--gold);box-shadow:0 0 0 6px #ffc83d33}
  .mstep.cur .no{background:var(--gold);color:#4a3600}

function K(v,t){ const str=v+"|"+t; let h1=0xdeadbeef,h2=0x41c6ce57; for(let i=0;i<str.length;i++){ const c=str.charCodeAt(i); h1=Math.imul(h1^c,2654435761); h2=Math.imul(h2^c,1597334677); }
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909); h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
  return (4294967296*(2097151&h2)+(h1>>>0)).toString(16).padStart(14,"0"); }
let CLIPS=new Set(), curAudio=null;
try{ fetch("audio/manifest.json").then(r=>r.json()).then(j=>{CLIPS=new Set(j)}).catch(()=>{}); }catch(e){}
function stopAudio(){ try{ if(curAudio){ curAudio.onended=null; curAudio.pause(); curAudio=null; } speechSynthesis.cancel(); }catch(e){} }
function ttsFallback(t,res){
  try{ const u=new SpeechSynthesisUtterance(t); u.lang="ja-JP"; u.rate=opt().rate; u.onend=res; u.onerror=res;
    const v=speechSynthesis.getVoices().find(v=>v.lang&&v.lang.startsWith("ja")); if(v) u.voice=v; speechSynthesis.speak(u); }catch(e){ res(); }
}
function speak(t,v){
  v=v||"n"; stopAudio();
  return new Promise(res=>{
    const key=K(v,t);
    if(CLIPS.has(key)){
      let fell=false; const fb=()=>{ if(fell) return; fell=true; ttsFallback(t,res); };
      try{ const a=new Audio("audio/s/"+key+".mp3"); curAudio=a; a.playbackRate=Math.max(.7,Math.min(1.25,opt().rate/.8)); a.onended=()=>res(); a.onerror=fb; a.play().catch(fb); }catch(e){ fb(); }
    } else ttsFallback(t,res);
  });
}
async function speakSeq(list,v){ for(const t of list) await speak(t,v); }

function playKeys(keys){
  stopAudio();
  return new Promise(res=>{ let i=0; const rate=Math.max(.7,Math.min(1.25,opt().rate/.8));
    const next=()=>{ if(i>=keys.length) return res(); const a=new Audio("audio/s/"+keys[i++]+".mp3"); curAudio=a; a.playbackRate=rate; a.onended=next; a.onerror=next; a.play().catch(next); };
    next(); });
}
function spk(tpl,v,fn){
  fn=fn||nm;
  if(childName && CLIPS.size && tpl.includes("{name}")){
    const pc=tpl.split("{name}");
    if(pc.length===2){
      const b=fn(pc[0]).trim(), a=fn(pc[1].replace(/^、/,"")).trim(), nk=K(v,"@"+childName);
      if(CLIPS.has(nk) && (!b||CLIPS.has(K(v,b))) && (!a||CLIPS.has(K(v,a)))){
        const ks=[]; if(b) ks.push(K(v,b)); ks.push(nk); if(a) ks.push(K(v,a)); return playKeys(ks);
      }
    }
  }
  let t=fn(tpl);
  if(childName && CLIPS.size && !CLIPS.has(K(v,t))){ const keep=childName; childName=""; const t2=fn(tpl); childName=keep; if(CLIPS.has(K(v,t2))) t=t2; }
  return speak(t,v);
}

let stats={streak:0,last:"",today:0,todayDate:"",goal:5,badges:[]};
try{ const s=localStorage.getItem("stats"); if(s) stats=Object.assign(stats,JSON.parse(s)); }catch(e){}
function saveStats(){ try{ localStorage.setItem("stats",JSON.stringify(stats)); }catch(e){} }
function todayStr(){ return new Date().toLocaleDateString("sv-SE"); }
function rollover(){ const t=todayStr(); if(stats.todayDate!==t){ stats.todayDate=t; stats.today=0; } }
rollover();
let combo=0, lastStarAt=0;
const LEVELS=[["🥚","たまご"],["🐣","ひよこ"],["🐥","ことり"],["🐤","げんき ことり"],["🦆","あひる"],["🦢","はくちょう"],["🦜","おしゃべり おうむ"],["🦅","わし"],["🐉","ドラゴン"],["🌟","スター"]];
function levelOf(n){ const i=Math.min(Math.floor(n/15),LEVELS.length-1); return {n:i,em:LEVELS[i][0],name:LEVELS[i][1],next:(i+1)*15}; }
const BADGES=[
  {id:"first",em:"🌱",t:"はじめの いっぽ",c:()=>stars>=1},
  {id:"goal",em:"🎯",t:"きょうの もくひょう",c:()=>stats.today>=stats.goal},
  {id:"s3",em:"🔥",t:"3にち れんぞく",c:()=>stats.streak>=3},
  {id:"s7",em:"🏆",t:"7にち れんぞく",c:()=>stats.streak>=7},
  {id:"st50",em:"⭐",t:"⭐ 50こ",c:()=>stars>=50},
  {id:"st100",em:"🌟",t:"⭐ 100こ",c:()=>stars>=100},
];
function checkBadges(){ for(const b of BADGES){ if(!stats.badges.includes(b.id) && b.c()){ stats.badges.push(b.id); saveStats(); return b; } } return null; }
function starsText(){ return "🔥 "+stats.streak+" ⭐ "+stars; }
function toast(html){ const d=document.createElement("div"); d.className="toast"; d.innerHTML=html; document.body.appendChild(d); setTimeout(()=>d.remove(),2400); }
let _ac=null;
function ac(){ try{ _ac=_ac||new (window.AudioContext||window.webkitAudioContext)(); if(_ac.state==="suspended") _ac.resume(); }catch(e){} return _ac; }
function tone(hz,t0,dur,type,vol){ const a=ac(); if(!a) return; const o=a.createOscillator(),g=a.createGain(); o.type=type||"triangle"; o.frequency.value=hz; const t=a.currentTime+t0; g.gain.setValueAtTime(vol||.14,t); g.gain.exponentialRampToValueAtTime(.001,t+dur); o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+dur+.02); }
const sfx={
  ok(){ [523,659,784].forEach((h,i)=>tone(h,i*.08,.28,"triangle",.16)); tone(1047,.26,.4,"sine",.1); },
  ng(){ tone(220,0,.18,"sine",.12); tone(185,.14,.28,"sine",.1); },
  tap(){ tone(900,0,.05,"sine",.05); },
  clear(){ [523,659,784,1047,784,1047,1319].forEach((h,i)=>tone(h,i*.11,.32,"triangle",.15)); },
  pop(){ tone(1200,0,.06,"sine",.08); tone(1600,.05,.08,"sine",.06); }
};
document.addEventListener("pointerdown",e=>{ ac(); if(e.target.closest&&e.target.closest(".btn,.card,.node,.choice,.chip,.spk,.say,.x")) sfx.tap(); },true);
function fx(t){ const d=document.createElement("div"); d.className="fx"; d.textContent=t; document.body.appendChild(d); setTimeout(()=>d.remove(),1100); const s=$(".stars"); if(s){ s.classList.remove("bump"); void s.offsetWidth; s.classList.add("bump"); } try{ navigator.vibrate&&navigator.vibrate(25); }catch(e){} }
function confetti(){
  const C=["#ff6b9d","#ffd84a","#3ddc97","#4c9bff","#9b6bff","#ff9f43"];
  for(let i=0;i<46;i++){ const d=document.createElement("i"); d.className="paperc"; d.style.left=(Math.random()*98)+"vw"; d.style.background=C[i%C.length]; d.style.animationDelay=(Math.random()*.7)+"s"; d.style.transform="rotate("+(Math.random()*360)+"deg)"; document.body.appendChild(d); setTimeout(()=>d.remove(),3300); }
  _confetti();
}
function _confetti(){ const E=["🎉","⭐","✨","🎊","🌟"]; for(let i=0;i<28;i++){ const s=document.createElement("span"); s.className="conf"; s.textContent=E[i%E.length]; s.style.left=(Math.random()*95)+"vw"; s.style.animationDelay=(Math.random()*0.8)+"s"; document.body.appendChild(s); setTimeout(()=>s.remove(),3200); } }
function chime(f){ try{ const ac=new (window.AudioContext||window.webkitAudioContext)(); (f||[660,880]).forEach((hz,i)=>{ const o=ac.createOscillator(),g=ac.createGain(); o.type="sine"; o.frequency.value=hz; const t0=ac.currentTime+i*0.12; g.gain.setValueAtTime(0.15,t0); g.gain.exponentialRampToValueAtTime(0.001,t0+0.25); o.connect(g); g.connect(ac.destination); o.start(t0); o.stop(t0+0.3); }); }catch(e){} }
function statusCard(){
  rollover(); const lv=levelOf(stars); const pct=Math.min(100,Math.round(stats.today/stats.goal*100));
  return `<div class="status"><div class="lv"><span style="font-size:44px">${lv.em}</span><div><b>${lv.name}</b><div class="hint">⭐ ${stars} / ${lv.next}</div></div></div>
    <div class="goal"><div>🎯 きょうの もくひょう ${Math.min(stats.today,stats.goal)}/${stats.goal}</div><div class="barwrap"><div class="barfill" style="width:${pct}%"></div></div>${stats.today>=stats.goal?'<div class="hint">たっせい！ きょうは もう おわりでも OK 🌙</div>':''}</div>
    <button class="btn ghost" onclick="go('badges')">🏅</button></div>`;
}
function badgesView(){
  $("#app").innerHTML = gameHead("🏅","バッジ")+`<div class="grid">`+BADGES.map(b=>{const on=stats.badges.includes(b.id);return `<div class="card" style="${on?'':'filter:grayscale(1);opacity:.45'}"><div class="em">${b.em}</div><div class="ja" style="font-size:20px">${b.t}</div></div>`}).join("")+`</div>`;
}
function addStar(){
  if(view.startsWith("game:")){ gameStars++; if(gameStars===3) setTimeout(()=>missionDone("game"),600); }
  stars++; try{localStorage.setItem("stars",stars)}catch(e){}
  rollover(); stats.today++;
  const t=todayStr(); let goalHit=false;
  if(stats.today===stats.goal){
    goalHit=true;
    const d=stats.last?Math.round((Date.parse(t+"T00:00:00")-Date.parse(stats.last+"T00:00:00"))/86400000):99;
    stats.streak=(d===1||d===2)?stats.streak+1:1; stats.last=t;
  }
  saveStats();
  const now=Date.now(); combo=(now-lastStarAt<25000)?combo+1:1; lastStarAt=now;
  const s=$(".stars"); if(s) s.textContent=starsText();
  fx(combo>=3?"+1 ⭐ 🔥×"+combo:"+1 ⭐");
  if(!goalHit) sfx.ok();
  if(goalHit){ chime([523,659,784,1047]); confetti(); toast("🎯 きょうの もくひょう たっせい！<br>🔥 "+stats.streak+"にち れんぞく"); }
  else if(combo===3||combo===5||combo===10){ toast("🔥 れんぞく せいかい ×"+combo); }
  const nb=checkBadges(); if(nb) setTimeout(()=>toast(nb.em+" バッジ「"+nb.t+"」"),goalHit?2800:800);
  const lv=levelOf(stars); if(stars>1 && levelOf(stars-1).n!==lv.n) setTimeout(()=>toast("🎉 レベルアップ！ "+lv.em+" "+lv.name),1800);
  if(goalHit){ setTimeout(()=>{ const p=pickPhrase("end"); if(p) playPhrase(p); },3200); }
  else setTimeout(cheer,1300);
}

// ===== はげましの こえ（ろくおん → この たんまつの IndexedDB に ほぞん）=====
let voices=[], rec=null, recChunks=[], lastCheer=0, recTimer=null;
const SAMPLE_CHEERS=["がんばれー！","すごいね！","できたね！","いいぞー！"];
function idb(){ return new Promise((res,rej)=>{ const r=indexedDB.open("nihongo",1);
  r.onupgradeneeded=()=>r.result.createObjectStore("voices",{keyPath:"id"});
  r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
async function loadVoices(){
  try{ const db=await idb();
    voices = await new Promise((res,rej)=>{ const q=db.transaction("voices").objectStore("voices").getAll(); q.onsuccess=()=>res(q.result); q.onerror=()=>rej(q.error); });
  }catch(e){ voices=[]; }
}
async function putVoice(blob){
  const db=await idb();
  await new Promise((res,rej)=>{ const t=db.transaction("voices","readwrite"); t.objectStore("voices").put({id:Date.now(),blob,who:(document.getElementById("recWho")||{}).value||""}); t.oncomplete=res; t.onerror=()=>rej(t.error); });
}
async function delVoice(id){
  try{ const db=await idb();
    await new Promise((res,rej)=>{ const t=db.transaction("voices","readwrite"); t.objectStore("voices").delete(id); t.oncomplete=res; t.onerror=()=>rej(t.error); });
  }catch(e){}
  await loadVoices(); renderVoiceList();
}
function playVoice(v){ try{ stopAudio(); const a=new Audio(URL.createObjectURL(v.blob)); curAudio=a; a.play().catch(()=>{}); }catch(e){} }
function cheer(){
  const now=Date.now(); if(now-lastCheer<2000) return; lastCheer=now;
  const p=pickPhrase("praise");
  const cp=people.filter(x=>x.cheers&&x.cheers.length);
  if(voices.length && Math.random()<0.4){ const v=voices[Math.floor(Math.random()*voices.length)]; const who=people.find(x=>String(x.id)===String(v.who)); if(who) showCheer(who,"🎙️"); playVoice(v); }
  else if(cp.length && Math.random()<0.7){ const who=cp[Math.floor(Math.random()*cp.length)], line=who.cheers[Math.floor(Math.random()*who.cheers.length)]; showCheer(who,line); speak(line,who.v||"n"); }
  else if(p) playPhrase(p);
  else speak(SAMPLE_CHEERS[Math.floor(Math.random()*SAMPLE_CHEERS.length)]);
}

// ===== 日本語の シャワー =====
// 名前よびかけ・あいさつ・きせつ・はげまし。Google Cloud の こうひんしつ おんせい(audio/*.mp3)を さいせい。
// ファイルが まだ ない とき は、たんまつの こえで だいよう。
let PHRASES=[], childName="";
try{ childName=localStorage.getItem("childName")||""; }catch(e){}
try{ fetch("phrases.json").then(r=>r.json()).then(j=>{PHRASES=j}).catch(()=>{}); }catch(e){}
function nameSlug(n){ return Array.from(n).map(c=>c.codePointAt(0).toString(16)).join("-"); }
function phraseText(p){ return childName ? p.ja.split("{name}").join(childName) : p.ja.split("{name}、").join("").split("、{name}").join("").split("{name}").join(""); }
function phraseTr(p){ const t=HT(p.ja,p.tr&&p.tr.ne); if(!t) return ""; return childName ? t.split("{name}").join(childName) : t.split(", {name}").join("").split("{name}, ").join("").split("{name}").join(""); }
function clipUrl(p){ return childName ? "audio/names/"+nameSlug(childName)+"/"+p.id+".mp3" : "audio/"+p.id+".mp3"; }
function playPhrase(p){
  if(CLIPS.size) return spk(p.ja,"p");
  return new Promise(res=>{
    let done=false, failed=false;
    const fin=()=>{ if(!done){ done=true; res(); } };
    const fb=()=>{ if(failed||done) return; failed=true;
      try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(phraseText(p)); u.lang="ja-JP"; u.rate=opt().rate; u.onend=fin; u.onerror=fin; speechSynthesis.speak(u); }catch(e){ fin(); } };
    try{ stopAudio(); const a=new Audio(clipUrl(p)); curAudio=a; a.onended=fin; a.onerror=fb; a.play().catch(fb); }catch(e){ fb(); }
  });
}
function pickPhrase(ctx){ const l=PHRASES.filter(p=>p.ctx===ctx); return l.length?l[Math.floor(Math.random()*l.length)]:null; }
function seasonCtx(){ const m=new Date().getMonth()+1; return m>=3&&m<=5?"season-spring":m>=6&&m<=8?"season-summer":m>=9&&m<=11?"season-autumn":"season-winter"; }
function greetCtx(){ const h=new Date().getHours(); return h>=5&&h<10?"greet-morning":h>=10&&h<17?"greet-noon":"greet-evening"; }
async function ohanashi(){
  const seq=[pickPhrase(greetCtx()), pickPhrase(seasonCtx()), pickPhrase(Math.random()<0.5?"praise":"cheer")].filter(Boolean);
  for(const p of seq){
    const b=$("#bubble"); if(b){ const tr=opt().hint?phraseTr(p):""; b.innerHTML="🗨️ "+phraseText(p)+(tr?`<div class="hint">${tr}</div>`:""); }
    await playPhrase(p); await new Promise(r=>setTimeout(r,300));
  }
}
function renderVoiceList(){
  const el=$("#voiceList"); if(!el) return;
  el.innerHTML = voices.length ? voices.map((v,i)=>`<div style="display:flex;align-items:center;gap:8px;margin:4px 0"><button onclick="playVoice(voices[${i}])">▶</button><span style="flex:1">${(people.find(q=>q.id===v.who)||{}).name||"こえ "+(i+1)}</span><button onclick="delVoice(${v.id})">✕</button></div>`).join("") : `<div class="hint">まだ ありません（サンプルの こえが でます）</div>`;
}
async function toggleRec(){
  const btn=$("#recBtn"), msg=$("#recMsg");
  if(rec && rec.state==="recording"){ rec.stop(); return; }
  try{
    const s=await navigator.mediaDevices.getUserMedia({audio:true});
    rec=new MediaRecorder(s); recChunks=[];
    rec.ondataavailable=e=>recChunks.push(e.data);
    rec.onstop=async()=>{
      clearTimeout(recTimer); s.getTracks().forEach(t=>t.stop());
      btn.textContent="🎙️ ろくおんする"; msg.textContent="";
      try{ await putVoice(new Blob(recChunks,{type:rec.mimeType||"audio/webm"})); await loadVoices(); renderVoiceList(); }catch(e){ msg.textContent="ほぞんできませんでした"; }
    };
    rec.start(); btn.textContent="⏹️ とめる"; msg.textContent="はなしてね（8びょうまで）";
    recTimer=setTimeout(()=>{ if(rec && rec.state==="recording") rec.stop(); },8000);
  }catch(e){ msg.textContent="マイクが つかえません（https で ひらいてね）"; }
}
function shuffle(a){return a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1])}

let storyI=0;
function nm(s){ return childName? s.split("{name}").join(childName) : s.split("{name}、").join("").split("、{name}").join("").split(", {name}").join("").split("{name}, ").join("").split("{name}").join(""); }
function storyPlay(id){
  const S=STORIES.find(s=>s.id===id), n=S.nodes[storyI], hn=opt().hint;
  const head=lessonHead("home",storyI/S.nodes.length*100)+banner("story_"+id);
  const nextNode=()=>{ storyI++; if(storyI>=S.nodes.length) storyEnd(S); else storyPlay(id); };
  if(n.t==="talk"){
    $("#app").innerHTML=head+`<div class="dlg"><div><div class="av">${n.em}</div><div class="who">${n.who}</div></div>
     <div class="say" id="line">${nm(n.ja)}${hn?`<span class="hint">${nm(n.ne)}</span>`:""}</div></div>
     <div class="chips">${n.words.map((w,i)=>`<button class="chip" data-w="${i}">🔤 ${w.ja}${hn?" = "+w.ne:""}</button>`).join("")}</div>
     <div class="bar"><button class="btn ghost" id="again">🔊 もういちど</button><button class="btn" id="next">つぎ ▶</button></div>`;
    $("#line").onclick=$("#again").onclick=()=>spk(n.ja,vOf(n.who));
    document.querySelectorAll("[data-w]").forEach(b=>b.onclick=()=>speak(n.words[b.dataset.w].ja));
    $("#next").onclick=nextNode;
    setTimeout(()=>spk(n.ja,vOf(n.who)),250);
  } else {
    $("#app").innerHTML=head+`<div class="dlg"><div><div class="av">🧑‍🎓</div><div class="who">じぶん</div></div>
     <div class="say" style="background:#fff4d6;cursor:default">${nm(n.ja)}${hn?`<span class="hint">${nm(n.ne)}</span>`:""}</div></div>
     <div id="choices">`+
     shuffle(n.ch).map(c=>`<div class="choice" data-i="${n.ch.indexOf(c)}">${nm(c.ja)}${hn&&c.ne?`<span class="hint">${nm(c.ne)}</span>`:""}</div>`).join("")+`</div>`;
    setTimeout(()=>spk(n.ja,"n"),250);
    let lock=false;

function k2h(s){ return s.replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60)).replace(/[\s、。！？!?,.・ー]/g,""); }
function sim(a,b){ if(!a||!b) return 0; const m=a.length,n=b.length, d=Array.from({length:m+1},(_,i)=>[i].concat(Array(n).fill(0))); for(let j=1;j<=n;j++) d[0][j]=j;
  for(let i=1;i<=m;i++) for(let j=1;j<=n;j++) d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1)); return 1-d[m][n]/Math.max(m,n); }
function strictMode(){ try{ return localStorage.getItem("strict")||"easy"; }catch(e){ return "easy"; } }
function listen(keys,full){
  return new Promise(res=>{
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!SR){ res({na:true}); return; }
    let got=false; const r=new SR(); r.lang="ja-JP"; r.maxAlternatives=5; r.interimResults=false;
    r.onresult=e=>{ got=true; const alts=Array.from(e.results[0]).map(a=>a.transcript);
      const mode=strictMode(), th={normal:0.6,hard:0.85}[mode];
      const ok = (th && full) ? alts.some(a=>sim(k2h(a),k2h(full))>=th) : alts.some(a=>keys.some(k=>k2h(a).includes(k2h(k)))); res({ok,heard:alts[0]}); };
    r.onerror=e=>{ res({ok:false,err:e.error,na:e.error==="not-allowed"||e.error==="service-not-allowed"||e.error==="language-not-supported"}); };
    r.onend=()=>{ if(!got) res({ok:false,heard:""}); };
    try{ r.start(); setTimeout(()=>{try{r.stop()}catch(e){}},6000); }catch(e){ res({na:true}); }
  });
}

function petAsk(k){
  const a=petActs()[k]; petAct=k; petTry=0; const pool=a.v.filter(x=>x.lv===petLv(k)+1); petV=pool[Math.floor(Math.random()*pool.length)];
  const hn=opt().hint, v=petV;

    <div class="psr">

      <div class="chat me"><div class="who">👤 あなたの ばん：こう いってみよう</div><div class="cbub mine">${v.say}${hn?`<div class="hint">${v.sayNe}</div>`:""}</div></div>
      <div class="crow"><button class="btn ghost" id="pm">🔊 おてほん</button><button class="btn" id="pr" style="font-size:26px;flex:1">🎤 はなす</button></div>
      <div class="msg" id="msg"></div><div id="pfb"></div></div></div>`;

}
function petPass(full){
  pet.mood=Math.min(100,petMood()+(full?15:6)); pet.t=Date.now(); if(full) pet.hearts++;
  pet.lvl=pet.lvl||{}; pet.stk=pet.stk||{}; let lvMsg="";
  if(full){ pet.stk[petAct]=(pet.stk[petAct]||0)+1; if(pet.stk[petAct]>=2&&petLv(petAct)<3){ pet.lvl[petAct]=petLv(petAct)+1; pet.stk[petAct]=0; lvMsg="🆙 "+petActs()[petAct].label+" レベル "+(petLv(petAct)+1)+"！ ことばが ながく なるよ"; } }
  else { pet.stk[petAct]=0; if(petLv(petAct)>0){ pet.lvl[petAct]=petLv(petAct)-1; lvMsg="つぎは みじかい ことばから いこうね"; } }
  if(lvMsg) setTimeout(()=>toast(lvMsg),600);
  pet.learned=pet.learned||{}; const L=pet.learned[petV.say]||{ne:petV.sayNe,n:0}; L.n+=full?1:0; pet.learned[petV.say]=L;
  const td=todayStr(); if(!pet.day||pet.day.d!==td) pet.day={d:td,n:0,done:false}; pet.day.n++;
  let bonus=false; if(pet.day.n>=3&&!pet.day.done){ pet.day.done=true; bonus=true; }
  if(pet.day.n>=3) missionDone("pet");
  savePet();
  $("#msg").style.color=""; $("#msg").textContent=full?"つうじたよ！ 😄":"いっしょに いえたね！";
  if(full) addStar();
  setTimeout(()=>spk(full?"ありがとう、{name}！":"いっしょに がんばったね、{name}！","p"),full?1800:0);
  if(bonus) setTimeout(()=>{ toast("🎁 きょうの おせわ ぜんぶ できた！"); confetti(); addStar(); },900);
  setTimeout(petHome,4200);
}
async function petSpeak(){
  const v=petV; $("#msg").style.color="var(--accent)"; $("#msg").textContent="🎤 きいてるよ…";
  const r=await listen(v.keys,v.say);
  if(r.na){ $("#msg").textContent=""; $("#pfb").innerHTML=`<p class="hint">この たんまつでは おんせい にんしきが つかえません。こえに だして いってから ボタンを おしてね。</p><button class="btn" id="pok">いえた！</button>`; $("#pok").onclick=()=>petPass(true); return; }
  if(r.ok) return petPass(true);
  petTry++;
  if(petTry>=3){ $("#msg").style.color="#c96a25"; $("#msg").textContent="いっしょに いおう！"; await new Promise(res=>{ const u=speak(v.say); setTimeout(res,2200); }); return petPass(false); }
  $("#msg").style.color="#c96a25"; $("#msg").innerHTML=`${petFace(40)} ん？ もういちど！<div class="hint" style="font-size:16px">${r.heard?"きこえた: "+r.heard:"きこえなかった"}</div>`;

}

let joLv=0, joStreak=0; try{ joLv=+localStorage.getItem("jlv")||0; }catch(e){}
const JO_POOL=[["は","を","に"],["は","を","に","が","で","の","と"],["は","を","に","が","で","の","と","も","へ","から","まで"]];
function joshi(){

  const [,pre,ans,post,ne]=q, pool=JO_POOL[lv];
  const conf={"に":["で","へ"],"で":["に","を"],"は":["が","も"],"が":["は","を"],"を":["に","が"],"へ":["に","で"],"の":["は","と"],"と":["の","に"],"も":["は","が"]};
  const ch=shuffle([ans,...shuffle((conf[ans]||[]).filter(x=>pool.includes(x)).concat(pool.filter(x=>x!==ans))).filter((x,i,a)=>x!==ans&&a.indexOf(x)===i).slice(0,2)]);
  $("#app").innerHTML=gameHead("🔤","じょし（てにをは）")+`<div class="jo"><div class="jlv">レベル ${"●".repeat(lv+1)}${"○".repeat(2-lv)}</div>

  let lock=false, missed=false;
  document.querySelectorAll(".jbtn").forEach(b=>b.onclick=()=>{
    if(lock) return; const c=b.dataset.c, key="j:"+pre+ans+post;
    if(c===ans){ lock=true; b.classList.add("good"); $("#jb").textContent=ans; $("#jb").classList.add("ok"); skillRec(key,!missed); speak(full); addStar();
      if(!missed){ joStreak++; if(joStreak>=5&&joLv<2){ joLv++; joStreak=0; try{ localStorage.setItem("jlv",joLv); }catch(e){} setTimeout(()=>toast("🆙 じょし レベルアップ！"),700); } }

// ===== ゲーム：まねっこ（おてほんを きいて、じぶんの こえで いう → きいて くらべる）=====
// ろくおんは この たんまつの メモリ だけ。ほぞんも おくりも しない。
function manekko(){
  const pool = COURSES[course].scenes.flatMap(s=>s.items);
  const SKm=skillAll(), weakP=pool.filter(i=>COURSES[course].scenes.some(sc=>sc.items.includes(i)&&(SKm[`w:${sc.id}:${i.ja}`]||{ng:0,ok:0}).ng>(SKm[`w:${sc.id}:${i.ja}`]||{ng:0,ok:0}).ok));
  const src=(weakP.length&&Math.random()<0.5)?weakP:pool, it = src[Math.floor(Math.random()*src.length)];
  let mine = null, recorder = null;
  $("#app").innerHTML = gameHead("🎤","まねっこ") +
    `
     <div class="grid" style="grid-template-columns:minmax(220px,360px);justify-content:center"><div class="card"><div class="em">${it.em}</div><div class="ja">${disp(it)}</div><div class="es">${hint(it)}</div></div></div>
     <div class="msg" id="msg" style="margin-top:14px"></div>
     <div class="bar">
       <button class="btn" id="model">🔊 おてほん</button>
       <button class="btn" id="mic" style="background:#4a7be0;box-shadow:0 4px 0 #2f57a8">🎙️ いってみよう</button>
       <button class="btn ghost" id="mine" disabled>▶ じぶんの こえ</button>
       <button class="btn ghost" id="next">つぎ →</button>
     </div>`;
  $("#model").onclick = ()=>speak(say(it));
  setTimeout(()=>speak(say(it)),300);
  $("#next").onclick = manekko;
  $("#mine").onclick = ()=>{ if(mine){ try{ new Audio(URL.createObjectURL(mine)).play(); }catch(e){} } };
  $("#mic").onclick = async ()=>{
    if(recorder && recorder.state==="recording") return;
    try{
      const s = await navigator.mediaDevices.getUserMedia({audio:true});
      const chunks=[]; recorder = new MediaRecorder(s);
      recorder.ondataavailable=e=>chunks.push(e.data);
      recorder.onstop=()=>{
        s.getTracks().forEach(t=>t.stop());
        mine = new Blob(chunks,{type:recorder.mimeType||"audio/webm"});
        $("#mine").disabled=false; $("#msg").textContent="じょうず！ きいてみよう"; addStar();
        setTimeout(()=>{ try{ new Audio(URL.createObjectURL(mine)).play(); }catch(e){} },900);
      };
      recorder.start(); $("#msg").style.color="#c96a25"; $("#msg").textContent="🔴 いってね…";
      setTimeout(()=>{ if(recorder.state==="recording") recorder.stop(); $("#msg").style.color=""; },3000);
    }catch(e){ $("#msg").style.color="#c96a25"; $("#msg").textContent="マイクが つかえません"; }
  };
}

// ===== ゲーム：きゅうしょく とうばん（先生の指示を聞いて、おぼんに のせる）=====
const FOODS = [
  {n:"ぎゅうにゅう", em:"🥛", tr:{es:"Leche",ne:"दूध"}},
  {n:"ごはん", em:"🍚", tr:{es:"Arroz",ne:"भात"}},
  {n:"おはし", em:"🥢", tr:{es:"Palillos",ne:"चपस्टिक"}},
  {n:"みそしる", em:"🍲", tr:{es:"Sopa de miso",ne:"मिसो सुप"}},
  {n:"サラダ", em:"🥗", tr:{es:"Ensalada",ne:"सलाद"}},
  {n:"くだもの", em:"🍎", tr:{es:"Fruta",ne:"फलफूल"}},
];
function kyushoku(){
  const order = shuffle(FOODS).slice(0,3);
  const tray = [];
  let step = 0;
  const cmd = f => f.n + "を おぼんに のせてください";
  function draw(){
    const target = order[step];
    $("#app").innerHTML = gameHead("🍱","きゅうしょく とうばん") +
      `
       <div class="q"><button class="btn" id="again">👩‍🏫 🔊 せんせいの ことば</button></div>
       <div class="msg" id="msg"></div>
       <div id="tray" style="text-align:center;font-size:56px;min-height:90px;background:#fff;border-radius:24px;padding:10px;margin:10px 0;box-shadow:0 5px 0 var(--soft)">🍽️ ${tray.map(t=>t.em).join(" ")}</div>
       <div class="grid" id="choices">` +
      shuffle(FOODS).map(f=>`<div class="card" data-n="${f.n}"><div class="em">${f.em}</div><div class="es">${hint(f)}</div></div>`).join("") + `</div>`;
    $("#again").onclick = ()=>speak(cmd(target),"c");
    setTimeout(()=>speak(cmd(target),"c"), 300);
    document.querySelectorAll("#choices .card").forEach(el=>{
      el.onclick = ()=>{
        if(el.dataset.n===target.n){
          tray.push(target); step++;
          if(step>=order.length){
            $("#tray").textContent = "🍽️ " + tray.map(t=>t.em).join(" ");
            $("#msg").textContent="できた！ いただきます！🎉";
            speak("できた！ いただきます！"); addStar(); addStar();
            setTimeout(kyushoku, 3500);
          } else { speak("そう！"); setTimeout(draw, 700); }
        } else {
          el.classList.add("bad"); setTimeout(()=>el.classList.remove("bad"),400);
          speak(cmd(target),"c");
        }
      };
    });
  }
  draw();
}
function findScene(id){ return COURSES[course].scenes.find(x=>x.id===id) }
function speakHint(t){
  if(!t) return; const L={ne:"ne-NP",es:"es-ES"}[opt().lang]||"ne-NP";
  try{ const v=speechSynthesis.getVoices().find(v=>v.lang&&v.lang.replace("_","-").toLowerCase().startsWith(L.slice(0,2)));
    if(!v){ toast("この たんまつに この ことばの こえが ありません"); return; }
    speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(t); u.lang=L; u.voice=v; speechSynthesis.speak(u); }catch(e){}
}
function tapCard(i,sid){ speak(say(findScene(sid).items[i])); }

let qs={sid:null,n:0};
function quiz(sid){
  if(qs.sid!==sid) qs={sid,n:0};
  const s = findScene(sid), N=5;
  if(qs.n>=N){ return lessonClear(s); }
  const SK=skillAll(), wk=i=>{ const v=SK[`w:${sid}:${i.ja}`]; return v?(v.ng>v.ok?4:v.ok-v.ng>=2?0.5:1):1.5; };
  let pick=Math.random()*s.items.reduce((a,i)=>a+wk(i),0), answer=s.items[0]; for(const i of s.items){ pick-=wk(i); if(pick<=0){ answer=i; break; } }
  const mst=masteryOf(sid);
  const big = course==="big";
  const exs = exOf(answer), cloze = exs.length && Math.random()<(mst<0.3?0.15:mst<0.6?0.45:0.8);
  const sent = cloze ? exs[Math.floor(Math.random()*exs.length)] : null;
  const others = shuffle(s.items.filter(x=>x!==answer && !(sent&&sent[0].includes(x.ja)))).slice(0,2);
  const choices = shuffle([answer,...others]);
  const sayQ = ()=>speak(cloze?sent[0]:say(answer));
  const lang=opt().lang, trS = cloze&&opt().hint?sent[1]:"";
  $("#app").innerHTML = lessonHead("scene:"+sid, qs.n/N*100) + banner(sid) + `<div class="qtitle">${s.em} ${s.title}　${cloze?"ぶんを きいて えらぼう":"きいて えらぼう"}</div>`
    + (cloze?`<div class="qsent">${sent[0].replace(answer.ja,'<span class="blank">＿＿＿</span>')}</div>${trS?`<div class="qtr">${trS}</div>`:""}`:"")
    + `<button class="spk" id="again" aria-label="もういちど">🔊</button>
    <div class="grid ${big?'big-course':''}" id="choices">` + choices.map(c=>`<div class="card" data-ok="${c===answer?1:0}"><div class="em">${c.em}</div>${(big||cloze)?`<div class="ja">${disp(c)}</div>`:""}<div class="es">${hint(c)}</div></div>`).join("") + `</div>`;
  $("#again").onclick=sayQ;
  setTimeout(sayQ,300);
  let lock=false, missed=false;
  document.querySelectorAll("#choices .card").forEach(el=>{
    el.onclick=()=>{
      if(lock) return;
      if(el.dataset.ok==="1"){
        lock=true; el.classList.add("good"); qs.n++; addStar(); skillRec(`w:${sid}:${answer.ja}`,!missed);
        document.querySelector(".pbar i").style.width=(qs.n/N*100)+"%";
        const ex1 = cloze ? sent : exs[0];
        speakSeq(ex1?["すごい！",say(answer),ex1[0]]:["すごい！",say(answer)]);
        const body = `${answer.em} ${disp(answer)}${hint(answer)?"　"+hint(answer):""}` + (ex1?`<div class="exs">${ex1[0].replace(answer.ja,"<b>"+answer.ja+"</b>")}${opt().hint&&ex1[1]?"<br><small>"+ex1[1]+"</small>":""}</div>`:"");
        sheet(true,"せいかい！ ✨",body,"つぎへ ▶",()=>quiz(sid));
      }else{
        el.classList.add("bad"); setTimeout(()=>el.classList.remove("bad"),400);
        sayQ();
        sheet(false,"おしい！","もういちど きいて みよう","もういちど",null);
      }
    };
  });
}
function lessonClear(s){
  doneAdd("scene:"+s.id); missionDone("word",s.id); confetti(); sfx.clear(); qs.sid=null;
  $("#app").innerHTML=`<div class="clear">${petBody(200,100)}<h2>${s.em} ${s.title} クリア！</h2><div class="xp">⭐ +5</div>
    <div class="bar"><button class="btn" onclick="go('home')">つぎの レッスンへ ▶</button><button class="btn ghost" onclick="go('quiz:${s.id}')">もういちど</button></div></div>`;
  speak("クリア！ すごい！");
}


// 【かいはつようの】しゃべる ぶんしょうを ぜんぶ あつめる（audio を つくるときに つかう）
function collectSpeech(){
  const out=[], add=(v,t)=>{ if(t) out.push({v,t}); }, pn=x=>x.split("{pet}").join("コロ"), pnAll=x=>x.includes("{pet}")?Object.values(PETS).map(q=>x.split("{pet}").join(q.name)):[x];
  for(const c of Object.values(COURSES)) for(const sc of c.scenes) for(const it of sc.items){ add("n",say(it)); exOf(it).forEach(e=>add("n",e[0])); }
  for(const S of STORIES) for(const n of S.nodes){ if(n.t==="talk"){ add(vOf(n.who),n.ja); n.words.forEach(w=>add("n",w.ja)); } else { add("n",n.ja); n.ch.forEach(c=>add("n",c.ja)); } }
  for(const E of EVENTS) for(const n of E.nodes){ if(n.t==="talk") pnAll(n.ja).forEach(t=>add(vOf(n.who),t)); else pnAll(n.say).forEach(t=>add("n",t)); }
  JOSHI.forEach(x=>{ add('n',x[1]+x[2]+x[3]); });
  const g0=greetCtx; ["greet-morning","greet-noon","greet-evening"].forEach(ctx=>{ greetCtx=()=>ctx; Object.values(petActs()).forEach(a=>a.v.forEach(v=>{ add("p",v.cue); add("n",v.say); })); }); greetCtx=g0;
  ["さびしいよ〜","あそぼう！","げんきだよ！","さびしいよ〜。あそぼう！","ありがとう！ だいすき！","きょうも いっしょに やろう！","ありがとう、{name}！","いっしょに がんばったね、{name}！","ママ、ありがとう！","パパ、ありがとう！"].forEach(t=>add("p",t));
  for(let i=1;i<=20;i++) add("p","あと "+i+" こ！ がんばろう！");
  ["すごい！","そう！","せいかい！","クリア！ すごい！","できた！ いただきます！","ん？ もういちど ゆっくり いってみて。"].concat(SAMPLE_CHEERS).forEach(t=>add("n",t));
  MISSIONS.forEach(m=>add("n",m.say));
  FOODS.forEach(f=>add("c",f.n+"を おぼんに のせてください"));
  GIFTS.forEach(g=>{ add("n",g.n); SAMPLE_PEOPLE.forEach(p=>add("n",p.name+"に "+g.n+"を あげてください")); });
  SAMPLE_PEOPLE.forEach(p=>{ p.cheers.forEach(t=>add(p.v,t)); add(p.v,p.name+"、ありがとう！"); });
  Array.from(HIRA).forEach(c=>{ add("n",c); add("n",String.fromCharCode(c.charCodeAt(0)+0x60)); });
  const seen=new Set(); return out.filter(x=>{ const k=x.v+"|"+x.t; if(seen.has(k)) return false; seen.add(k); return true; });
}

// ===== 母語ヒントの きりかえ（ne=ネパール／vi／zh／fil／id）=====
// 訳は lang/<code>.json（キー＝にほんごの ぶん）。ne は もとの データを そのまま つかう。
let PACK={}, HREG=null;
const HT=(key,ne)=>{ let l="ne"; try{ l=$("#optLang").value; }catch(e){} return l==="ne"?(ne||""):(PACK[key]||""); };
function hintReg(){
  if(HREG) return HREG; const R=[], reg=(o,f,key)=>{ if(o&&o[f]) R.push({o,f,key,orig:o[f]}); };
  for(const k in COURSES) for(const sc of COURSES[k].scenes){ reg(sc.tr,"ne",sc.title); for(const it of sc.items||[]) reg(it.tr,"ne",it.ja); }
  for(const ja in EX) for(const e of EX[ja]) reg(e,1,e[0]);
  for(const S of STORIES){ reg(S,"ne",S.title); for(const n of S.nodes){ if(n.t==="talk"){ reg(n,"ne",n.ja); n.words.forEach(w=>reg(w,"ne",w.ja)); } else { reg(n,"ne",n.ja); n.ch.forEach(c=>{ reg(c,"ne",c.ja); reg(c,"why","why:"+c.ja); }); } } }
  for(const e of EVENTS){ reg(e,"ne",e.title); for(const n of e.nodes) reg(n,"ne",n.t==="say"?n.say:n.ja); }
  for(const j of JOSHI) reg(j,4,j[1]+"□"+j[3]);
  return HREG=R;
}
function applyHints(){ const l=$("#optLang").value; hintReg().forEach(r=>{ r.o[r.f]= l==="ne"?r.orig:(PACK[r.key]||""); }); }
async function setHintLang(l,noRender){
  try{ localStorage.setItem("hlang",l); }catch(e){}
  PACK={}; if(l!=="ne"){ try{ PACK=await (await fetch("lang/"+l+".json")).json(); }catch(e){ PACK={}; } }
  const sel=$("#optLang"); if(sel) sel.value=l; applyHints(); if(!noRender) render();
}
