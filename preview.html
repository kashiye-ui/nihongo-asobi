<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>にほんご あそび｜タブレットで見る</title>
<style>
  html,body{margin:0;height:100%;background:#1b1d26;color:#cfd3e0;font-family:system-ui,"Noto Sans JP",sans-serif;overflow:hidden}
  .bar{position:fixed;top:0;left:0;right:0;height:46px;display:flex;gap:8px;align-items:center;justify-content:center;background:#12141b;z-index:5;font-size:14px}
  .bar button{background:#2a2e3d;color:#fff;border:1px solid #444a60;border-radius:8px;padding:6px 12px;cursor:pointer;font-size:14px}
  .bar button.on{background:#6c5ce7;border-color:#6c5ce7}
  #stage{position:absolute;top:46px;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center}
  #dev{position:relative;background:#0b0b0f;border-radius:44px;padding:26px;box-shadow:0 0 0 3px #3b3f52,0 20px 60px rgba(0,0,0,.6);transform-origin:center center;flex:none}
  #dev .cam{position:absolute;width:10px;height:10px;border-radius:50%;background:#1d2030;box-shadow:inset 0 0 0 2px #2a2e40}
  #dev.land .cam{left:9px;top:50%;margin-top:-5px}
  #dev.port .cam{top:9px;left:50%;margin-left:-5px}
  #scr{background:#fff;border-radius:14px;overflow:hidden}
  iframe{border:0;display:block;width:100%;height:100%;background:#fff}
</style></head><body>
<div class="bar">
  <button id="bL" class="on">横向き</button><button id="bP">縦向き</button>
  <button id="bS" class="on">10インチ</button><button id="bM">8インチ</button>
  <button id="bR">⟳ 再読み込み</button>
</div>
<div id="stage"><div id="dev" class="land"><div class="cam"></div><div id="scr"><iframe id="f" src="./index.html"></iframe></div></div></div>
<script>
let land=true, big=true;
const dev=document.getElementById("dev"), scr=document.getElementById("scr"), st=document.getElementById("stage");
function fit(){
  // 画面の css サイズ（10インチ≈1280x800 / 8インチ≈1024x768）
  let w=big?1280:1024, h=big?800:768; if(!land){ [w,h]=[h,w]; }
  scr.style.width=w+"px"; scr.style.height=h+"px"; dev.className=land?"land":"port";
  const pad=52+12, k=Math.min((st.clientWidth-24)/(w+pad), (st.clientHeight-24)/(h+pad), 1);
  dev.style.transform="scale("+k+")";
  document.getElementById("bL").className=land?"on":""; document.getElementById("bP").className=land?"":"on";
  document.getElementById("bS").className=big?"on":""; document.getElementById("bM").className=big?"":"on";
}
bL.onclick=()=>{land=true;fit()}; bP.onclick=()=>{land=false;fit()}; bS.onclick=()=>{big=true;fit()}; bM.onclick=()=>{big=false;fit()};
bR.onclick=()=>{document.getElementById("f").contentWindow.location.reload()};
addEventListener("resize",fit); fit();
</script></body></html>
